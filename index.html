<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Satisfy Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one full-window 16:9 stage; pixel canvas underneath, HTML system windows (manhwa-style) on top */
:root{
  --bg:#06070c; --sys:rgba(10,32,64,.84); --sys2:rgba(6,18,40,.95); --line:#8fd8ff; --glow:rgba(90,190,255,.32); --ink:#eaf2ff; --muted:#9db0cf;

  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

#game{position:absolute;left:0;top:0;image-rendering:pixelated;will-change:transform;image-rendering:crisp-edges;display:block}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*1.45);line-height:1.4;font-family:var(--body)}
#ui[lang=ar]{--body:var(--ar-body);--head:var(--ar-head)}
#ui[lang=en]{--body:var(--en-body);--head:var(--en-head)}
.sys{position:relative;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),linear-gradient(180deg,rgba(16,46,88,.88),rgba(6,18,40,.92));border:1px solid rgba(143,216,255,.7);border-radius:2px;box-shadow:0 0 calc(var(--u)*1) var(--glow),inset 0 0 calc(var(--u)*1.6) rgba(90,190,255,.12);padding:calc(var(--u)*.8) calc(var(--u)*1.1)}
.sys::before,.sys::after{content:"";position:absolute;width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);border:2px solid #dff6ff;pointer-events:none;filter:drop-shadow(0 0 3px #8fd8ff)}
.sys::before{left:-2px;top:-2px;border-right:0;border-bottom:0}.sys::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.head{font-family:var(--head);font-weight:400;color:#dff6ff;line-height:1.2;text-shadow:0 0 calc(var(--u)*.6) rgba(143,216,255,.55)}

button:hover,button:focus-visible{background:linear-gradient(180deg,rgba(90,160,240,.7),rgba(40,90,170,.7));outline:none;box-shadow:0 0 calc(var(--u)*1) rgba(143,216,255,.75);transform:translateY(-1px) scale(1.04)}
button:active{transform:scale(.96)}

/* HUD */
#hud{position:absolute;inset:0}
#stats{position:absolute;inset-inline-start:calc(var(--u)*1);top:calc(var(--u)*1);width:calc(var(--u)*24)}
.nm{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:calc(var(--u)*.3)}

.recipe .req{color:var(--muted);font-size:calc(var(--u)*1.1)}
.req .ok{color:#9fe39a}.req .no{color:#ff9a8a}
#mg .head{font-size:calc(var(--u)*1.9)}
.mgbar{position:relative;height:calc(var(--u)*3);margin:calc(var(--u)*1.2) 0 calc(var(--u)*.6);background:linear-gradient(90deg,#4a1712,#9a3f1a 35%,#9a3f1a 65%,#4a1712);border:calc(var(--u)*.15) solid #000;border-radius:calc(var(--u)*.4);direction:ltr}
.mgbar .good{position:absolute;inset-block:0;background:rgba(240,150,60,.75)}
.mgbar .perf{position:absolute;inset-block:0;background:var(--gold);box-shadow:0 0 calc(var(--u)*1) var(--gold)}
.mgbar .cur{position:absolute;top:calc(var(--u)*-.8);bottom:calc(var(--u)*-.8);width:calc(var(--u)*.5);margin-left:calc(var(--u)*-.25);background:#fff;box-shadow:0 0 calc(var(--u)*.7) #fff}

.logo{text-align:center;line-height:1}

/* patch 1 */
#game.dead{filter:grayscale(1) brightness(.75);transition:filter .8s}#game{transition:filter .5s}

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s ease}#fade.on{opacity:1}

.key:hover{transform:translateY(-2px)}

"Bun",h_twin:"Twin tails",h_side:"Side-swept",h_curly:"Curly",hpot:"Health Potion",mpot:"Mana Potion",hpotD:"Restores 40% of your HP at once.",mpotD:"Restores 50% of your MP at once.",oBuyPot:"Buy {p} ({g} gold)",potBuy:"Here you go. Don't drink them all at once.",potFull:"You already carry 10. You can't hold more.",noPot:"No {p} left",clickDrink:"Click to drink ({k})",zPat:"Patrian",zHigh:"Patrian Highlands",zMarsh:"Ashur Marsh",zRuin:"Old Watchtower",zRoadW:"Western Wilds",zRoadE:"Patrian High Road",ashur:"Earl Ashur",pcap:"Patrian Guard Captain",coachP:"Patrian Coachman",merchantP:"Patrian Merchant",armorerP:"Patrian Armorer",innP:"Patrian Innkeeper",hwolfN:"Highland Wolf",rboarN:"Crimson Tusk Boar",deserterN:"Deserter",mgolemN:"Bog Golem",dcaptN:"Deserter Captain",oTravelP:"Travel to Patrian ({g} gold)",mHiP:"Patrian is a garrison town, but the market still runs. Bread and goods, and I buy materials.",arHiP:"This gear is for those past level 50. Not cheap, but the Earl's soldiers wear it.",innPHi:"Patrian Inn. A room is 30 gold, and the bed beats a tent in the marsh.",as_hi:"A traveler from Winston? Patrian sits on the edge of the north, and we lose guards on the road every day. If your sword works, the captain will find you a job.",as_idle:"The border doesn't wait. The captain has word from the highlands.",pc_hi:"Keep a hand on your weapon in here. We're short on men, and anyone who can fight is welcome.",pc_low:"I have more work for you, but what waits outside the wall is no place for beginners. Come back at level {lv}.",as_low:"The earldom has troubles beyond you for now. Come back at level {lv}.",pc_idle:"The guard is spread along the wall. If you see anything strange on the road, tell me.",pt1:"Highland Wolves",q_bk1:"Wood for the Oven",bk1_o:"The oven won't heat without wood, and the forest past the wall isn't safe for me. Bring me 6 wood from the village trees.",bk1_w:"I still need that wood. The oven's gone cold.",bk1_d:"Ah! The smell of bread is back. Take these.",q_bk2:"The Oven Grate",bk2_o:"The iron grate in my oven broke. Bring me 4 ore and Smith will fix it.",bk2_w:"The grate is still broken.",bk2_d:"Bless your hands. The oven is better than before.",q_rg1:"Grey Forest Wolves",rg1_o:"Want to be strong? The grey wolves are level 100. Kill 3 and come back.",rg1_w:"The wolves are still waiting in the forest.",rg1_d:"Not bad. Your body is learning what real danger feels like.",q_rg2:"Forest Bears",rg2_o:"The bears are far worse. Kill 2, and if you come back alive I'll call you my equal.",rg2_w:"The bears won't come to you.",rg2_d:"Hahaha! You actually came back. You're as mad as I am.",q_wg1:"Goblin Raids",wg1_o:"Goblins come up from the canyon and rob the carts. Kill 10 of them.",wg1_w:"The canyon is south of town, and the goblins are still there.",wg1_d:"The road is quieter. Thank you, adventurer.",q_wg2:"Men of the Lake",wg2_o:"Mermen keep coming out of the lake and attacking the fishermen. Kill 8 of them.",wg2_w:"The lake is west of Winston.",wg2_d:"The fishermen are back at work. Take your reward.",q_hn1:"Rabbit Hunt",hn1_o:"Want to learn hunting? Start with rabbits. Hunt 10.",hn1_w:"The rabbits are in the fields around town.",hn1_d:"Light hands. You could make a fine hunter.",q_hn2:"Hides for the Tanner",hn2_o:"The tanner needs hides. Bring me 6 leather.",hn2_w:"I still need the leather.",hn2_d:"Good hides. Here's your share.",q_pw1:"Wolves of the Wilds",pw1_o:"Plains wolves are coming onto the road and attacking travellers. Kill 10 and I'll give you a good price.",pw1_w:"The wolves are west of the waystation.",pw1_d:"Travellers can pass safely now. Thank you.",q_pe1:"Highwaymen",pe1_o:"Highwaymen have closed the high road. Kill 8 of them.",pe1_w:"The outlaws hold the middle of the road.",pe1_d:"The road is open. The merchants will bless you.",q_pe2:"Wolves of the East Road",pe2_o:"Highland wolves now come down to the road near Patrian. Kill 8.",pe2_w:"The wolves are near Patrian.",pe2_d:"Now I can reach Patrian without fear.",q_fp1:"Boars in the Crops",fp1_o:"Crimson Tusk boars are eating the crops. Kill 6 before the harvest.",fp1_w:"The boars are in the highlands north of the wall.",fp1_d:"The crops are saved. Bless you.",q_fp2:"Blankets for Winter",fp2_o:"Winter is harsh here. Bring me 10 leather to make blankets for the children.",fp2_w:"I still need the leather.",fp2_d:"The children will sleep warm. Thank you.",q_hp1:"Snow Bears",hp1_o:"The great snow bears are coming down from the north. Kill 6 and the Earl will reward you.",hp1_w:"The bears are in the snowfields north of the highlands.",hp1_d:"A real hunter. Take this.",guardW:"Winston Gate Guard",hunter:"Hunter",pedW:"Travelling Peddler",pedE:"Travelling Peddler",farmerP:"Patrian Farmer",hunterP:"Patrian Hunter",gw_idle:"No one passes this gate without me seeing.",hn_idle:"The fields are full of game if you keep your eyes open.",fp_idle:"The soil here is good, but the beasts are many.",hp_idle:"The highlands teach you patience.",ped_hi:"Welcome, traveller! It's a long road. Take some potions and bread.",oQuestAsk:"Any work? ({q})",q_pt1:"Highland Wolves",q_pt2:"Crimson Tusks",q_pt3:"Armor for Winter",q_pt4:"The Deserter Gang",q_pt5:"Mud Golems",q_pt6:"The Deserter Captain",pt1_o:"Wolves are coming down from the highlands north of town and attacking the carts. Kill 10 of them.",pt1_w:"The wolves are still howling on the road.",pt1_d:"The road is quieter. Take your pay, and come back. There's more work.",pt2:"The Crimson Tusk",pt2_o:"Crimson Tusk boars are breaking the farm fences. Kill 8 before they reach the gate.",pt2_w:"The farmers are still complaining about the boars.",pt2_d:"Clean work. The Earl has heard of you and wants to see you.",pt3:"Hides for the Garrison",pt3_o:"Winter is coming and the guards need leather armor. Bring me 12 leather.",pt3_w:"We still need the leather before the snow.",pt3_d:"The garrison owes you. Patrian doesn't forget who stands with it.",pt4:"Deserters in the Marsh",pt4_o:"Soldiers who fled the army have formed a gang in Ashur Marsh, south of town. Kill 10 of them.",pt4_w:"The deserters are still robbing the caravans.",pt4_d:"You hit them where it hurts. But their captain still lives, and the Earl will speak with you.",pt5:"Bog Golems",pt5_o:"The deserters hide behind mud golems that wake in the marsh. Break 6 of them so we can reach the captain.",pt5_w:"The golems still guard the way.",pt5_d:"The road to the old tower is open. The captain is hiding there.",pt6:"The Deserter Captain",pt6_o:"The deserters' captain holds the Old Watchtower east of the wall. He was one of my best knights. Kill him and come back.",pt6_w:"His banner still flies over the tower.",pt6_d:"He was my friend once. Patrian is safe thanks to you, and your name goes in the town's records.",w1:"Satisfy. A virtual reality game with over two billion players, so real it became a second life.",w2:"{n} logged in for the first time in Winston, a city of the Eternal Kingdom. No class, level 1, and everything still ahead.",w3:"They say a player called Grid found a legendary class a while ago... just rumors.",zWin:"Winston",zFields:"Winston Fields",zCamp:"Goblin Camp",zBai:"Bairan Village",zGrey:"Grey Forest (Lv 96+)",zGuard:"Guardian's Den",zRoad:"Bairan Road",zQuarry:"Quarry",enterZ:"Entered: {z}",smith:"Smith the Blacksmith",grid:"Grid",regas:"Regas",tw:"Warrior Trainer",ta:"Archer Trainer",tm:"Magic Instructor",board:"Quest Board",merchant:"Winston Merchant",coachW:"Winston Coachman",rabbitN:"Wild Rabbit",goblinN:"Goblin",gchiefN:"Goblin Chief",mstone:"Mana Stone",bow:"Hunter's Bow",staff:"Novice Staff",hammer:"Smith's Hammer",cl_novice:"Novice",cl_warrior:"Warrior",cl_archer:"Archer",cl_mage:"Magician",cl_smith:"Blacksmith",clsGot:"[Class change: {c}]",q_kh1:"Firewood for the Forge",q_kh2:"Iron Ore",q_kh3:"Your First Sword",q_kh4:"Leather Armor",q_cw:"Warrior's Trial",q_ca:"Archer's Trial",q_cm:"Magician's Trial",q_cb:"Blacksmith's Trial",q_bnt:"Bounty: Goblin Chief",q_hunt:"Clear the Fields",q_sm1:"[Chop Firewood]",q_sm2:"[Mine Iron Ore]",q_sm3:"[Create a Jaffa Arrow]",o_have:"Bring {it}: {c}/{n}",o_kill:"Defeat {it}: {c}/{n}",o_craft:"Craft {it}: {c}/{n}",o_craftR:"Craft any Rare or better item: {c}/{n}",retTo:"Return to {w}",noQuest:"No quests right now. Talk to people with a ! above them",qNew:"New quest: {q}",qDone:"Quest complete: {q}",qAccept:"Accept",qDecline:"Not now",qReward:"Reward: {r}",needLv:"Requires level {n}",kh_hi:"Hm? A new player? This is Khan's smithy, and I don't like people touching my anvil.",kh1_o:"If you want to learn, start at the bottom. The furnace needs wood. Bring me 6 pieces from the trees in town.",kh1_w:"You haven't brought the wood yet.",kh1_d:"Not bad. Fine, you can use the anvil. Just don't break it.",kh2_o:"A smith without iron is useless. There are ore rocks in the fields east of town. Bring me 5.",kh2_w:"The ore is in the eastern fields. Watch out for goblins.",kh2_d:"Good iron. Let's see your hands. Make an iron sword on the anvil.",kh3_o:"Forge an iron sword. Heat, hammer, quench. Each stage has its moment.",kh3_w:"The sword isn't made yet.",kh3_d:"...Not bad for a beginner. I've hammered iron for forty years. I know hands with a future.",kh4_o:"War isn't just swords. Make leather armor. Wild rabbits drop leather.",kh4_w:"Still no armor.",kh4_d:"Now you can head into the fields with some peace of mind. If you want to be a real blacksmith, come back at level 5.",kh_idle:"The anvil is waiting. A real smith never stops hammering.",kh_grid:"Grid? I've heard of him... that kid has strange hands. One day he'll surpass me.",cb_o:"You want to be a blacksmith? Craft an item of Rare quality or better, and I'll teach you the secrets of the trade.",cb_w:"You haven't made anything Rare yet.",cb_d:"Those are a smith's hands. From today you are a blacksmith. Smiths reach ratings no one else can.",tw_hi:"The sword is no toy, kid. Come back at level {lv}.",trOther:"You are already training with another trainer. Finish with them first.",trDone:"I have nothing for you right now. Keep training out there.",cw_o:"Prove you are no coward. Defeat 5 goblins in the eastern fields.",cw_w:"The goblins still live.",cw_d:"That's a warrior! Take this, and always stand in the front line.",ta_hi:"An archer's eye matters more than the hand. Come back at level {lv}.",ca_o:"Hunt 8 wild rabbits. Speed is everything.",ca_w:"Still short on rabbits.",ca_d:"Hawk eyes! This bow is yours now.",tm_hi:"Mana flows through everything. Come to me at level {lv}.",cm_o:"The goblins steal mana stones. Bring me 3 of them.",cm_w:"I need 3 mana stones.",cm_d:"You can feel the mana... take this staff. Welcome to the path of magic.",clsTaken:"You already have a class.",bnt_o:"[Bounty] The Goblin Chief raids caravans south-east of the fields. Reward: 120 gold.",bnt_w:"[Bounty] The Goblin Chief still lives.",bnt_d:"[Bounty] Done! 120 gold added to your bag.",hunt_o:"[Task] Goblins are multiplying. Defeat 10 of them.",hunt_w:"[Task] There are still goblins.",hunt_d:"[Task] Thank you, adventurer!",board_idle:"[Quest Board] No tasks available right now.",sm_hi:"Who are you? A rude kid walking into my smithy like that? ...Fine, if you want to learn, first you chop firewood.",sm1_o:"Take this old axe. Chop 10 pieces of firewood from the village trees.",sm1_w:"The firewood isn't done yet.",sm1_d:"What? That fast? ...You're not ordinary.",sm2_o:"Bring me 8 iron ore from the quarry behind the smithy.",sm2_w:"The quarry is behind the smithy.",sm2_d:"That breaks my record! How are you like this?",sm3_o:"I'll teach you Jaffa arrows. Make 5 bundles, and we'll split them half and half.",sm3_w:"Still no arrows.",sm3_d:"...These are masterpieces. I'm taking all of them, sorry. Take this money instead.",sm_idle:"You remind me of Pagma himself... get back to work.",grid1:"What? You want something? I'm busy. And if you want a weapon, the prices are high.",grid2:"People think smithing is easy... every strike on the anvil hurts.",grid3:"Saw the notice? Yeah, that was me. I won't tell you how.",rg_hi:"I'm Regas. Our party hunts in the Grey Forest. We have Blue Orichalcum from the Guardian raid if you want to buy.",rRaidNo:"Join us? At level {lv}? You'd die in a second. Come back at level 90.",oTravelW:"Travel to Winston ({g} gold)",oTravelB:"Travel to Bairan ({g} gold)",coachHi:"It's a dangerous route, and the beasts around Bairan are over level 100. 200 gold a trip; we arrive by morning.",noGold:"You don't have enough gold.",mHi:"Welcome to Winston! Bread and goods, and I buy Jaffa arrows.",noAnvil:"Don't touch my anvil without my permission! Do what I tell you first.",annGrid:"Grid, Pagma's Successor, forged the first Legendary item in Satisfy's history!",sk_strike:"Power Strike",skd_strike:"A strike dealing 180% damage.",sk_whirl:"Whirlwind",skd_whirl:"Spin and hit everything around you for 150%.",sk_charge:"Charge",skd_charge:"Dash forward, dealing 200% and stunning.",sk_rapid:"Rapid Shot",skd_rapid:"Three arrows in quick succession.",sk_pierce:"Piercing Arrow",skd_pierce:"An arrow that passes through all enemies, 220%.",sk_rain:"Arrow Rain",skd_rain:"Arrows rain on an area ahead, 140% each.",sk_fireball:"Fireball",skd_fireball:"A fireball that explodes for 240% in an area.",sk_nova:"Frost Nova",skd_nova:"Freezes nearby enemies for 2 seconds.",sk_bolt:"Lightning Bolt",skd_bolt:"Lightning strikes a line ahead for 300%.",sk_smash:"Hammer Smash",skd_smash:"220% damage and stuns the target.",sk_focus:"Craftsman's Focus",skd_focus:"Your next craft is easier and better.",sk_rage:"Blacksmith's Rage",skd_rage:"+30% damage and +25% attack speed for 10s.",sk_roar:"Forest Roar",skd_roar:"Stuns nearby monsters for 2.5s.",sk_cry:"Chief's Cry",skd_cry:"Terrifies nearby monsters.",skCost:"{mp} MP · {cd}s cooldown",skUnlock:"Unlocks at level {n}",skTitle:"Title skill",skBar:"Skills",rebind:"Skill keys",pressKey:"Press a key...",keyTaken:"That key is taken",resetKeys:"Reset",focusOn:"Craftsman's Focus: nex bk1:'"Pagma, the Legendary Blacksmith. He said smithing must benefit people, not be sold to whoever pays most."',bk2:'"The Eternal Kingdom: the north is Earl Steim\'s land, and Winston is the most important town in it."',bk3:'"The beasts around Bairan move on instinct and are very fast. No one below level 120 should leave alone."',bk4:'"The Grey Forest\'s golems guard something. They say blue orichalcum forms from moonlight."',bk5:'"The frostlight orcs live in the northern snowfields. Their hide keeps out the cold."',bk6:'"Ratings: Normal, Rare, Epic, Unique, Legendary. A legendary appears once in a lifetime."',boarN:'Wild Boar',gbearN:'Giant Brown Bear',mermanN:'Lake Merman',pwolfN:'Plains Wolf',outlawN:"Winston's Outlaw",pragaN:"Praga, Winston's Outlaw",forcN:'Frostlight Orc',fochiefN:'Frostlight Orc Chief',golemN:'Golem',cgolemN:'Crystal Golem',
zOut:'Bairan Outskirts (Lv 100+)',zPlains:'Central Plains',zSnow:'Northern Snowfields',zOrc:'Frostlight Orc Village',zLake:'The Lake',zHide:"Outlaws' Hideout",zCanyon:'Goblin Canyon',zGrave:'North Hill',hGrave:'E: Read the gravestone',graveT:"Here lies Khan's son. The flowers beside it are still fresh...",bq_kill:'Hunt {n} {it}',bq_have:'Bring {n} {it}',bTurn:'Turn in: {q}',bTake:'Take: {q} ({r})',bHi:'[Quest Board] Pick a task. The board refreshes every so often.',bFull:'[Quest Board] You already carry 3 board tasks. Finish one first.',rwH:'Rewards',rwXP:'{n} XP',rwGold:'{n} gold',rwPts:'{n} stat points',rwCls:'New class: {c}',rwItem:'{i}',rwLine:'[ Reward: {r} ]',qdFrom:'From: {w}',qdObj:'Objective',qCancel:'Abandon quest',qCancelSure:'Sure? Click again to abandon',qCanceled:'Quest abandoned: {q}',qdHint:'Click a quest to see its details',eqMark:'Equipped now',deadX:'Lost {x} XP.',deadLv:'Your level dropped to {n}!',deadPick:'Where do you want to respawn?',deadIn:'Respawning in {n}...',goW:"You need {g} gold for the carriage. Walking means crossing Bairan's outskirts, where the beasts are level 100+.",c1:"Satisfy. A virtual reality game with over two billion players.",c2:"Shin Youngwoo, known in the game as Grid. A level 73 warrior with no talent, who dreams of changing his life through the game.",c3:"After three months of travel, he finally reached the Northern End Cave, chasing an S-rank quest from Earl Ashur.",c4:"Grid woke up in the temple of Yatan, the god of darkness. Level -1, 14 health, every stat at 1.",c5:"Later, a careless logout in the middle of a fight dropped him to level -3. Penniless, he reached a remote village called Bairan.",c6:"An old blacksmith named Khan lived there...",skip:"Skip intro",cont2:"Continue",sysN:"System",pq:"[Earl Ashur's Secret Request] (S): find the treasure at the end of the Northern End Cave",pq2:"[Earl Ashur's Anger] (SS): survive Earl Ashur",ashur:"Earl Ashur",knight:"Knight",cwolfN:"Cave Wolf",clsW:"Warrior",g0:"Finally.. function hitBox(x,y,r){return solidT(Math.floor((x-r)/TS),Math.floor((y-3)/TS))||solidT(Math.floor((x+r)/TS),Math.floor((y-3)/TS))||solidT(Math.floor((x-r)/TS),Math.floor((y+2)/TS))||solidT(Math.floor((x+r)/TS),Math.floor((y+2)/TS));}
function move(e,dx,dy,r){if(hitBox(e.x,e.y,r)){e.x+=dx;e.y+=dy;e.mvd=1;return;}if(dx&&!hitBox(e.x+dx,e.y,r)){e.x+=dx;e.mvd=1;}if(dy&&!hitBox(e.x,e.y+dy,r)){e.y+=dy;e.mvd=1;}}

function nearTree(){const v=[[0,1],[0,-1],[1,0],[-1,0]][P.dir];let best=null,bs=1e9,bc=null,bcs=1e9;for(const tr of vtNear(P.x,P.y,30)){const dx=tr.x-P.x,dy=tr.y-P.y,d=Math.hypot(dx,dy);if(d>30)continue;const s=d-((dx*v[0]+dy*v[1])/(d||1))*12;if((chopped.get(tr.k)||0)>gTime){if(s<bcs){bcs=s;bc=tr;}}else if(s<bs){bs=s;best=tr;}}return best||bc;}
function nearest(){let best=null,bd=26;const cand=[...npcs.filter(n=>!n.hidden).map(n=>({k:'npc',o:n,x:n.x,y:n.y})),...ANVILS.map(a=>({k:'anvil',o:a,x:a.tx*TS+8,y:a.ty*TS+8})),...nodes.map(n=>({k:'node',o:n,x:n.x,y:n.y})),...ROOMS.map(R=>{const d=doorOf(R.b);return{k:'door',o:R,x:d.x,y:d.y,hint:'hEnter'};}),...PROPS.filter(p=>p.k==='chest'||p.k==='shelf'||p.k==='bed').map(p=>({k:'prop',o:p,x:p.tx*TS+p.w*8,y:p.ty*TS+(p.back?22:10),hint:{chest:'hChest',shelf:'hShelf',bed:'hBed'}[p.k]})),{k:'grave',o:GRAVE,x:GRAVE.tx*TS+8,y:GRAVE.ty*TS+16,hint:'hGrave'}];for(const c of cand){const d=Math.hypot(c.x-P.x,c.y-P.y)-(c.o&&c.o.reach||0);if(d<bd){bd=d;best=c;}}const tr=nearTree();if(tr){const d=Math.hypot(tr.x-P.x,tr.y-P.y)-6;if(!best||d<bd)best={k:'tree',o:tr,x:tr.x,y:tr.y};}return best;}
function interact(){const n=nearest();if(!n){SFX.deny();return;}pressKey('kE');if(n.k==='npc'){if(!n.o.obj)n.o.dir=Math.abs(P.x-n.o.x)>Math.abs(P.y-n.o.y)?(P.x>n.o.x?2:3):(P.y>n.o.y?0:1);talkNPC(n.o.id);}else if(n.k==='anvil')tryForge(n.o);else if(n.k==='node')mine(n.o);else if(n.k==='tree')chop(n.o);else if(n.k==='door')enterRoom(n.o);else if(n.k==='prop')useProp(n.o);else if(n.k==='grave')visitGrave();}

 if(Rm){resume();leaveRoom(Rm);return;}

 npcs.forEach(n=>{if(n.hidden||n.obj)return;if(n.d0===undefined)n.d0=n.dir;const dx=P.x-n.x,dy=P.y-n.y;n.dir=!P.ghost&&Math.hypot(dx,dy)<40?(Math.abs(dx)>Math.abs(dy)?(dx>0?2:3):(dy>0?0:1)):n.d0;});

// ---- monster fighting styles (SAT-AI-001/002). Every kind has a small move set and picks among them by distance and chance,

// them can be beaten by simply walking backwards: chasers sprint for a while, leapers and chargers close gaps fast.
//   leap  jump at where you stand (aim locks just before take-off)      line  rush in a locked straight line
//   arc   swing in a cone in front (combo: repeats faster)               ring  smash the ground all around
//   shot  throw something at you                                         buff  howl: the pack speeds up and attacks sooner
const AIK={rabbit:'hop',wolf:'lunge',pwolf:'lunge',hwolf:'lunge',boar:'charge',rboar:'charge',bear:'brute',gbear:'brute',golem:'slam',cgolem:'slam',mgolem:'slam',goblin:'soldier',merman:'soldier',outlaw:'soldier',deserter:'soldier',forc:'soldier'};

  {k:'buff',w:1,min:20,max:150,tele:.7,rec:.3,cd:1,once:9}],

  {k:'ring',w:1,max:28,tele:.5,reach:30,mul:.9,rec:.45,cd:2}],
 brute:[{k:'arc',w:3,max:32,tele:.48,reach:30,arc:1.25,mul:1.35,rec:.4,cd:1.7},{k:'arc',w:2,max:32,tele:.4,reach:30,arc:1.05,mul:.95,rec:.2,cd:2.2,combo:2},
  {k:'ring',w:1,max:40,tele:.75,reach:42,mul:1.5,rec:.6,cd:3,once:4}],
 slam:[{k:'ring',w:3,max:36,tele:.8,reach:34,mul:1.45,rec:.6,cd:2.3},{k:'arc',w:2,max:28,tele:.4,reach:26,arc:.8,mul:1.1,rec:.35,cd:1.4,kb:18},
  {k:'shot',w:2,min:50,max:150,tele:.7,spd:150,mul:1.1,rec:.5,cd:2.8,sp:'rock'}],
 soldier:[{k:'arc',w:3,max:28,tele:.32,reach:27,arc:1.05,mul:1,rec:.3,cd:1.1},{k:'line',w:2,min:26,max:72,tele:.4,dash:240,dashT:.22,mul:1.15,rec:.4,cd:1.8},
  {k:'arc',w:1,max:22,tele:.22,reach:22,arc:.8,mul:.6,rec:.3,cd:1.6,kb:22,stun:.45}]};

const XMOVES={outlaw:[{k:'shot',w:2,min:50,max:140,tele:.45,spd:190,mul:.8,rec:.3,cd:2.2,sp:'knife'}],deserter:[{k:'shot',w:2,min:50,max:140,tele:.42,spd:200,mul:.85,rec:.3,cd:2.2,sp:'knife'}]};
const movesOf=m=>m.mvs||(m.mvs=[...MOVES[AIK[m.type]],...(XMOVES[m.type]||[])]);

// packs (wolves, rabbits, boars, humanoids): engaged monsters of one style near each other share a leader. The leader cycles

const PACKY={lunge:1,soldier:1,hop:1,charge:1};
function packTick(m,AI,dt){if(!PACKY[AI])return;m.gT=(m.gT||0)-dt;
 if(m.gT<=0){m.gT=.5+rand()*.2;let ld=m;m.gn=1;for(const o of mons)if(o!==m&&!o.dead&&AIK[o.type]===AI&&o.eng>0&&!o.ret&&Math.hypot(o.x-m.x,o.y-m.y)<160){m.gn++;if(+o.id.slice(1)<+ld.id.slice(1))ld=o;}m.ld=ld;}
 if(m.ld===m&&m.gn>=2){m.gpT=(m.gpT??3.5)-dt;if(m.gpT<=0){m.gph=m.gph==='back'?'press':'back';m.gpT=m.gph==='back'?1.5+rand()*.8:4.5+rand()*2;

const phaseOf=m=>m.ld&&m.ld!==m&&(m.ld.dead||m.ld.ret)?'press':m.ld&&m.ld.gn>=2?m.ld.gph||'press':'press';
const busyIn=m=>{let n=0;if(m.ld)for(const o of mons)if(o!==m&&!o.dead&&o.ld===m.ld&&(o.st==='tele'||o.st==='dash'))n++;return n;};

function pickMove(m,d){const L=movesOf(m);m.once=m.once||{};let tot=0;
 const c=L.map((v,i)=>{const ok=d>=(v.min||0)&&d<=v.max&&!((m.once[i]||0)>gTime);const w=ok?v.w*(m.last===i?.35:1):0;tot+=w;return w;});
 if(!tot)return -1;let x=rand()*tot;for(let i=0;i<c.length;i++){x-=c[i];if(x<0)return i;}return -1;}
function hitBy(m,b,mv){const r=hurtPlayer(b.dmg*mv.mul,m.lv,m);if(r===2){if(mv.kb&&P.dash<=0)move(P,m.ax*mv.kb,m.ay*mv.kb,4);if(mv.stun){P.stun=Math.max(P.stun||0,mv.stun);vfx('stun',P.x,P.y-24,{life:mv.stun});}}return r;}
function monAct(m,b,AI,dx,dy,d,mr,dt){m.atkT=Math.max(0,(m.atkT||0)-dt);

 let sp=b.spd*(AI==='slam'?.9:1);if(AI==='brute'&&m.hp<m.max*.4){sp*=1.35;if(!m.enr){m.enr=1;vfx('rage',m.x,m.y);}}
 if(d>48&&!m.st){m.chT=(m.chT||0)+dt;}else m.chT=Math.max(0,(m.chT||0)-dt*2);
 if(m.sprT>0){m.sprT-=dt;sp*=AI==='slam'?1.25:1.5;if(m.sprT<=0)m.tired=1.6;}else if(m.tired>0){m.tired-=dt;sp*=.85;}else if(m.chT>1.1&&AI!=='hop'){m.sprT=2.2;m.chT=0;vfx('dust',m.x,m.y,{n:5});}
 if(m.st==='tele'&&mv){m.stT-=dt;m.tele=m.stT;
  const track=mv.k==='arc'||(mv.k==='leap'||mv.k==='shot')&&m.stT>=.14;
  if(track){m.ax=fx_;m.ay=fy_;m.face=dx>0?1:-1;if(mv.k==='leap')m.lL=Math.min(mv.max,d)+14;}
  if(m.stT>0)return;
  if(mv.k==='leap'||mv.k==='line'){m.st='dash';m.stT=mv.dashT;m.hitDone=0;m.atkT=mv.dashT+.1;m.dsp=mv.k==='leap'?(m.lL||40)/mv.dashT:mv.dash;
   if(mv.k==='leap')SFX.dodge();else vfx('dust',m.x,m.y,{n:8,angle:Math.atan2(-m.ay,-m.ax)});return;}
  m.atkT=.25;
  if(mv.k==='ring'){shake=Math.max(shake,.2);SFX.slam();vfx('dust',m.x,m.y,{n:14});for(let k=0;k<16;k++){const a=k/16*6.28;fx.push({x:m.x+Math.cos(a)*mv.reach*.8,y:m.y+Math.sin(a)*mv.reach*.45,vx:Math.cos(a)*30,vy:-rand()*50,t:.45,c:'#8a8f99'});}if(d<mv.reach+4)hitBy(m,b,mv);}
  else if(mv.k==='arc'){const ang=Math.atan2(dy,dx)-Math.atan2(m.ay,m.ax),da=Math.abs(Math.atan2(Math.sin(ang),Math.cos(ang)));vfx('slash',m.x+m.ax*8,m.y-8+m.ay*8,{angle:Math.atan2(m.ay,m.ax),rarity:0});if(d<mv.reach+6&&da<mv.arc)hitBy(m,b,mv);
   if((m.combo||0)>1){m.combo--;m.stT=m.tele=mv.tele*.6;return;}}
  else if(mv.k==='shot'){eproj.push({x:m.x+m.ax*8,y:m.y-10+m.ay*8,vx:m.ax*mv.spd,vy:m.ay*mv.spd,t:mv.max/mv.spd+.3,m,mv,sp:mv.sp,a:Math.atan2(m.ay,m.ax)});SFX.dodge();}
  else if(mv.k==='buff'){vfx('rage',m.x,m.y);SFX.notice();for(const o of mons)if(!o.dead&&AIK[o.type]===AI&&Math.hypot(o.x-m.x,o.y-m.y)<130){o.sprT=3;o.tired=0;o.cd=Math.min(o.cd,.3);o.eng=4;o.agg=1;}}
  m.st='rec';m.stT=mv.rec;return;}
 if(m.st==='dash'&&mv){m.stT-=dt;const ox=m.x,oy=m.y,step=m.dsp*dt;if(mv.k==='leap')m.hop=Math.sin(Math.min(1,1-m.stT/mv.dashT)*Math.PI)*Math.min(14,(m.lL||40)*.14);move(m,m.ax*step,m.ay*step,mr);
  const moved=Math.hypot(m.x-ox,m.y-oy);
  if(!m.hitDone&&Math.hypot(P.x-m.x,P.y-m.y)<b.r+9){m.hitDone=1;const r=hurtPlayer(b.dmg*mv.mul,m.lv,m);if(mv.wall&&r===2&&P.dash<=0)move(P,m.ax*14,m.ay*14,4);}
  if(mv.wall&&moved<step*.35){m.st=null;m.stun=1.3;m.cd=mv.cd;shake=Math.max(shake,.12);SFX.slam();vfx('stun',m.x,m.y-b.oy,{life:1.3});return;}
  if(m.stT<=0){m.st='rec';m.stT=mv.rec;m.hop=0;if(mv.k==='leap')vfx('dust',m.x,m.y,{n:6});}return;}
 if(m.st==='rec'){m.stT-=dt;if(m.stT<=0){m.st=null;m.cd=(mv?mv.cd:1)*(.8+rand()*.4);}return;}

 // low health: break off and back away for a while, toward the pack if there is one, healing a little; then come back

  if(g){const gx=g.x-m.x,gy=g.y-m.y,gl=Math.hypot(gx,gy)||1;if(gl>28){ax=ax*.4+gx/gl*.6;ay=ay*.4+gy/gl*.6;}}const al=Math.hypot(ax,ay)||1;
  chase(m,ax/al*40,ay/al*40,40,sp*1.1,mr,dt);m.face=ax>0?1:-1;if(m.flee<=0)m.cd=Math.min(m.cd,.3);return;}
 const ph=phaseOf(m);
 if(ph==='back'&&d<130){const R=AI==='hop'?46:96,tx=P.x-fx_*R,ty=P.y-fy_*R*.8,tdx=tx-m.x,tdy=ty-m.y,td=Math.hypot(tdx,tdy);if(td>6)chase(m,tdx,tdy,td,sp*.9,mr,dt);return;}
 // free: maybe start a move, otherwise position by style

 if(AI==='lunge'||AI==='hop'){const R=AI==='hop'?26:72,a=monHash(m)*6.28+gTime*.35,tx=P.x+Math.cos(a)*R,ty=P.y+Math.sin(a)*R*.72,tdx=tx-m.x,tdy=ty-m.y,td=Math.hypot(tdx,tdy);

}
// thrown rocks and knives
function updateEProj(dt){eproj=eproj.filter(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t<=0||solidT(p.x/TS|0,(p.y+8)/TS|0)){vfx('dust',p.x,p.y+6,{n:3});return false;}
 if(mode!=='dead'&&Math.hypot(P.x-p.x,P.y-8-p.y)<8){hurtPlayer(MT[p.m.type].dmg*p.mv.mul,p.m.lv,{x:p.x,y:p.y+8});return false;}return true;});}
function drawEProj(){for(const p of eproj){if(p.sp==='rock'){blob(ctx,p.x,p.y,3,3,'#6a6560');R(ctx,p.x-2,p.y-2,2,1,'#9a958f');ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(p.x-3,p.y+8,6,2);}
 else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);R(ctx,-4,-1,6,1,'#d8dde6');R(ctx,-5,-1,2,2,'#6b4428');R(ctx,2,-1,1,1,'#ffffff');ctx.restore();}}}
// telegraphs drawn on the ground under the monster
function drawTele(m){const b=MT[m.type],mv=m.mv;if(!mv||m.dead||m.st!=='tele')return;const k=1-Math.max(0,m.stT)/mv.tele,al=.18+k*.32;

 else if(mv.k==='leap'||mv.k==='line'){const L=mv.k==='line'?mv.dash*mv.dashT:(m.lL||40),w=mv.k==='line'?b.r+4:b.r+2;ctx.translate(m.x,m.y-2);ctx.rotate(a);ctx.fillRect(0,-w,L*Math.min(1,k*1.4),w*2);ctx.strokeRect(0,-w,L,w*2);}
 else if(mv.k==='shot'){ctx.translate(m.x,m.y-8);ctx.rotate(a);ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(mv.max*Math.min(1,k*1.3),0);ctx.stroke();}
 else if(mv.k==='buff'){ctx.fillStyle=`rgba(255,180,60,${al*.6})`;ctx.beginPath();ctx.ellipse(m.x,m.y,10+k*16,6+k*9,0,0,7);ctx.fill();}
 else{ctx.beginPath();ctx.moveTo(m.x,m.y-4);ctx.arc(m.x,m.y-4,mv.reach,a-mv.arc,a+mv.arc);ctx.closePath();ctx.fill();ctx.stroke();}
