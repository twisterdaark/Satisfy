<style>
/* Layout: one full-window 16:9 stage; pixel canvas underneath, HTML system windows (manhwa-style) on top */
:root{

function hitBox(x,y,r){return solidT(Math.floor((x-r)/TS),Math.floor((y-3)/TS))||solidT(Math.floor((x+r)/TS),Math.floor((y-3)/TS))||solidT(Math.floor((x-r)/TS),Math.floor((y+2)/TS))||solidT(Math.floor((x+r)/TS),Math.floor((y+2)/TS));}
function move(e,dx,dy,r){if(dx&&!hitBox(e.x+dx,e.y,r))e.x+=dx;if(dy&&!hitBox(e.x,e.y+dy,r))e.y+=dy;}

function eat(){if(S.bread<=0){toast(t('noBread'),'warn');SFX.deny();return;}if(P.food>=95){toast(t('full'));SFX.deny();return;}S.bread--;P.food=Math.min(100,P.food+40);P.hp=Math.min(maxHP(),P.hp+15);toast(t('ate'));SFX.eat();hudDirty=true;}
function nearTree(){const v=[[0,1],[0,-1],[1,0],[-1,0]][P.dir];let best=null,bs=1e9,bc=null,bcs=1e9;for(const tr of vtNear(P.x,P.y,30)){const dx=tr.x-P.x,dy=tr.y-P.y,d=Math.hypot(dx,dy);if(d>30)continue;const s=d-((dx*v[0]+dy*v[1])/(d||1))*12;if((chopped.get(tr.k)||0)>gTime){if(s<bcs){bcs=s;bc=tr;}}else if(s<bs){bs=s;best=tr;}}return best||bc;}
function nearest(){let best=null,bd=26;const cand=[...npcs.filter(n=>!n.hidden).map(n=>({k:'npc',o:n,x:n.x,y:n.y})),...ANVILS.map(a=>({k:'anvil',o:a,x:a.tx*TS+8,y:a.ty*TS+8})),...nodes.map(n=>({k:'node',o:n,x:n.x,y:n.y})),...ROOMS.map(R=>{const d=doorOf(R.b);return{k:'door',o:R,x:d.x,y:d.y,hint:'hEnter'};}),...PROPS.filter(p=>p.k==='chest'||p.k==='shelf'||p.k==='bed').map(p=>({k:'prop',o:p,x:p.tx*TS+p.w*8,y:p.ty*TS+(p.back?22:10),hint:{chest:'hChest',shelf:'hShelf',bed:'hBed'}[p.k]})),{k:'grave',o:GRAVE,x:GRAVE.tx*TS+8,y:GRAVE.ty*TS+16,hint:'hGrave'}];for(const c of cand){const d=Math.hypot(c.x-P.x,c.y-P.y)-(c.o&&c.o.reach||0);if(d<bd){bd=d;best=c;}}const tr=nearTree();if(tr){const d=Math.hypot(tr.x-P.x,tr.y-P.y)-6;if(!best||d<bd)best={k:'tree',o:tr,x:tr.x,y:tr.y};}return best;}
function interact(){const n=nearest();if(!n){SFX.deny();return;}pressKey('kE');if(n.k==='npc'){if(!n.o.obj)n.o.dir=Math.abs(P.x-n.o.x)>Math.abs(P.y-n.o.y)?(P.x>n.o.x?2:3):(P.y>n.o.y?0:1);talkNPC(n.o.id);}else if(n.k==='anvil')tryForge(n.o);else if(n.k==='node')mine(n.o);else if(n.k==='tree')chop(n.o);else if(n.k==='door')enterRoom(n.o);else if(n.k==='prop')useProp(n.o);else if(n.k==='grave')visitGrave();}
function enterRoom(Rm){SFX.open();fadeTo(()=>{P.x=(Rm.rx+6)*TS+8;P.y=(Rm.ry+6)*TS+10;P.dir=1;camSnap=true;hudDirty=true;});}
function leaveRoom(Rm){SFX.close();fadeTo(()=>{P.x=Rm.dx;P.y=Rm.dy+4;P.dir=0;camSnap=true;hudDirty=true;});}

 if(p.k==='chest'){if(S.chest[p.id]){toast(t('chestE'));SFX.deny();return;}S.chest[p.id]=1;const g=12+(rand()*30|0);S.gold+=g;coinFx({x:p.tx*TS+8,y:p.ty*TS+8},g);const m=['wood','ore','leather','bread'][rand()*4|0];if(m==='bread')S.bread=Math.min(9,S.bread+1);else addMat(m,1+(rand()*2|0));toast(t('chestO',{g}),'good');SFX.coin();hudDirty=true;save(true);return;}
 if(p.k==='shelf'){const bk=BOOKS[(p.tx*7+p.ty)%BOOKS.length];dialog('shelfN',[bk]);if(!S.books[bk]){S.books[bk]=1;S.hid.insi++;setTimeout(()=>toast(t('insiUp'),'good'),300);save(true);}}}

 fx.push({img:tr.cn,x:tr.tx*TS-6,y:tr.ty*TS-11,vx:0,vy:22,t:.7,fl:1});
 for(let i=0;i<16;i++)fx.push({x:tr.x+(rand()-.5)*14,y:tr.y-14-rand()*10,vx:(rand()-.5)*80,vy:-rand()*60,t:.6,c:rand()<.5?'#3f8a44':'#58a65a'});
 for(let i=0;i<8;i++)fx.push({x:tr.x,y:tr.y-6,vx:(rand()-.5)*70,vy:-rand()*70,t:.45,c:rand()<.5?'#8a5a32':'#c49a62'});hudDirty=true;}
function mine(n){if(n.dep>0){toast(t('hEmpty'));SFX.deny();return;}const c=1+(rand()<.45?1:0);addMat('ore',c);n.dep=n.village?15:25;SFX.mine();shake=.06;for(let i=0;i<10;i++)fx.push({x:n.x,y:n.y-4,vx:(rand()-.5)*70,vy:-rand()*70,t:.4,c:rand()<.5?'#c8743a':'#8f8a86'});hudDirty=true;}

function coinFx(src,g){const n=Math.min(16,4+Math.round(g/8));for(let i=0;i<n;i++)fx.push({x:src.x+(rand()-.5)*6,y:src.y-14,vx:(rand()-.5)*110,vy:-50-rand()*90,t:2,c:rand()<.3?'#fff3b0':'#f2c14e',home:1,dl:.25+rand()*.2,coin:1});
 for(let i=0;i<Math.min(7,n);i++)setTimeout(()=>tone(1100+i*90,.06,'square',.05),300+i*70);setTimeout(SFX.coin,300);

const NAMEK={grave:'graveN',goblin:'goblinN',rabbit:'rabbitN',gchief:'gchiefN',wolf:'wolfN',bear:'bearN',boar:'boarN',merman:'mermanN',pwolf:'pwolfN',gbear:'gbearN',outlaw:'outlawN',praga:'pragaN',forc:'forcN',fochief:'fochiefN',golem:'golemN',cgolem:'cgolemN'};
const itN=k=>t(NAMEK[k]||k);
const qName=id=>{const q=QD[id];return q&&q.nm?t(q.nm,q.nv):t('q_'+id);};
function qRewards(id){const q=QD[id],o=[];if(q.xp)o.push(t('rwXP',{n:q.xp}));if(q.gold)o.push(t('rwGold',{n:q.gold}));if(q.pts)o.push(t('rwPts',{n:q.pts}));if(q.item)o.push(t(q.item));if(q.mat)o.push(t('got',{n:q.mat[1],item:t(q.mat[0])}));if(q.title)o.push(t('tl_'+q.title));if(q.cls)o.push(t('rwCls',{c:t('cl_'+q.cls)}));return o;}
const qDone=id=>!!S.qs[id]&&S.qs[id].st===2;
const arrowN=()=>S.arrows.reduce((a,b)=>a+b,0);
function qCount(id){const o=QD[id].obj,s=S.qs[id];if(!s)return 0;if(o.t==='have')return S.mats[o.it]||0;return s.c||0;}
const qReady=id=>{const s=S.qs[id];return !!s&&s.st===1&&qCount(id)>=QD[id].obj.n;};
function qAvail(id){const q=QD[id];return !S.qs[id]&&(!q.pre||qDone(q.pre))&&(!q.cl2||S.cls===q.cl2)&&(!q.cls||(S.cls==='novice'&&!Object.keys(S.qs).some(k=>QD[k]&&QD[k].cls&&S.qs[k].st===1)));}
function qObjText(id){const o=QD[id].obj;return t(o.t==='craftR'?'o_craftR':'o_'+o.t,{it:itN(o.it),c:Math.min(qCount(id),o.n),n:o.n});}
function qEvent(type,key,r,slot){for(const id in S.qs){const s=S.qs[id],q=QD[id];if(!q||s.st!==1)continue;const o=q.obj,was=qReady(id);
  if((o.t===type&&o.it===key)||(type==='craft'&&o.t==='craftR'&&r>=1&&slot!=='x')){s.c=(s.c||0)+1;if(!was&&qReady(id)){toast(t('retTo',{w:t(q.by)}),'good');SFX.quest();}}}hudDirty=true;}
function acceptQ(id){S.qs[id]={st:1,c:0};toast(t('qNew',{q:qName(id)}),'good');SFX.quest();hudDirty=true;checkSkills();save(true);}
function takeArrows(n){for(let r=4;r>=0&&n>0;r--){const k=Math.min(n,S.arrows[r]);S.arrows[r]-=k;n-=k;}}
function mkItem(id,r){const rc=RC.find(x=>x.id===id);const it={uid:++S.uid,id,slot:rc.slot,r};if(rc.slot==='w'){it.atk=Math.round(rc.atk*MULT[r]);it.spd=rc.spd;}else it.def=Math.round(rc.def*MULT[r]);return it;}
function completeQ(id){const q=QD[id],o=q.obj;if(o.take){if(o.it==='jaffa')takeArrows(o.n);else S.mats[o.it]-=o.n;}
 S.qs[id].st=2;if(q.rep)delete S.qs[id];
 toast(t('qDone',{q:qName(id)}),'good');SFX.quest();
 if(q.gold){S.gold+=q.gold;coinFx(npcOf(q.by),q.gold);}
 if(q.item){const it=mkItem(q.item,1);S.items.push(it);if(q.cls)S.eqW=it.uid;toast(t('gotItem',{it:inm(it)}),'good');}
 if(q.cls){S.cls=q.cls;sbSig='';SFX.legendary();flash();setTimeout(()=>toast(t('clsGot',{c:t('cl_'+q.cls)}),'good'),400);checkSkills();}
 if(q.pts){S.pts+=q.pts;setTimeout(()=>toast(t('ptsGot',{n:q.pts}),'good'),300);}
 if(q.title)giveTitle(q.title);
 if(q.xp)gainXP(q.xp);hudDirty=true;save(true);}

const NPCT={

 smith:{hi:'sm_hi',idle:()=>S.cls==='smith'?'sm_s1':'sm_idle',opts:()=>S.cls==='smith'?[{l:t('oBuyOre'),f:()=>buyMat('smith','ore',8)}]:[]},
 tw:{low:'tw_hi',idle:()=>S.cls==='novice'?'tw_hi':'clsTaken'},
 ta:{low:'ta_hi',idle:()=>S.cls==='novice'?'ta_hi':'clsTaken'},
 tm:{low:'tm_hi',idle:()=>S.cls==='novice'?'tm_hi':'clsTaken'},
 board:{idle:()=>'board_idle'},
 grid:{idle:()=>S.ev.grid?'grid3':rand()<.5?'grid1':'grid2'},
 baker:{idle:()=>'bHi',opts:()=>[{l:t('oBuyBread'),f:()=>buyBread('baker')}]},

 armorer:{idle:()=>'arHi',opts:()=>[['larmor',80],['isword',150],['bow',140],['staff',140],['hammer',150]].map(([id,g])=>({l:t('oBuyGear',{it:t(id),g}),f:()=>buyGear(id,g)}))},

 innB:{idle:()=>'innBHi',opts:()=>[{l:t('oRest',{g:20}),f:()=>rest('innB',20)},{l:t('oBuyBread'),f:()=>buyBread('innB')}]},
 oldw:{hi:'ow_hi',idle:()=>'ow_idle'},
 regas:{idle:()=>S.raid?'rRaidOn':'rg_hi',opts:()=>{const o=[...sellOpt('regas')];if(!S.mats.blue)o.push({l:t('oBlue'),f:buyBlue});const g=mons.find(m=>m.type==='guardian');if(g&&!g.dead&&!S.raid)o.push({l:t('oRaid'),f:()=>S.lv<90?dialog('regas',[t('rRaidNo',{lv:S.lv})]):startRaid()});return o;}},

 coachW:{idle:()=>'coachHi',opts:()=>[{l:t('oTravelB',{g:fare()}),f:()=>travel(0,'coachW')},...(S.hag===undefined?[{l:t('oHaggle'),f:()=>haggle('coachW')}]:[])]}};
const fare=()=>S.hag?178:200;
function haggle(who){S.hag=rand()<.35+S.hid.dign*.01+S.hid.insi*.01?1:0;SFX.click();shopD(who,S.hag?'hagOk':'hagNo');}
// generated board tasks live in S.bq (offers) and S.bqa (accepted), and are registered into QD so the normal quest code tracks them
function regBQ(d){QD[d.id]={by:'board',nm:'bq_'+d.obj.t,nv:{n:d.obj.n,it:itN(d.obj.it)},obj:d.obj,xp:d.xp,gold:d.gold,rep:1,gen:1};}
function genBoard(){(S.bq||[]).forEach(d=>{if(!S.qs[d.id])delete QD[d.id];});const pool=Object.keys(MT).filter(k=>{const b=MT[k];return !b.boss&&b.aggro!==undefined&&b.lv[0]<=S.lv+6&&b.lv[1]>=S.lv-20&&(b.board!==0);});const o=[];
 for(let i=0;i<3&&pool.length;i++){const k=pool[(rand()*pool.length)|0],b=MT[k],n=4+((rand()*7)|0);o.push({id:'bq'+(++S.uid),obj:{t:'kill',it:k,n},xp:Math.round(b.xp*n*.7),gold:Math.round((b.gold||1)*n+8)});}
 const m=['wood','ore','leather'][(rand()*3)|0],n=4+((rand()*6)|0);o.push({id:'bq'+(++S.uid),obj:{t:'have',it:m,n,take:1},xp:14*n,gold:7*n});
 S.bq=o;S.bqT=S.playT+600;o.forEach(regBQ);}
function openBoard(){if(!S.bq||!S.bq.length||S.playT>(S.bqT||0))genBoard();const opts=[];
 Object.keys(S.qs).forEach(id=>{if(QD[id]&&QD[id].by==='board'&&qReady(id))opts.push({l:t('bTurn',{q:qName(id)}),f:()=>{completeQ(id);if(QD[id]&&QD[id].gen){delete S.bqa[id];delete QD[id];}openBoard();}});});
 const nAct=Object.keys(S.qs).filter(id=>QD[id]&&QD[id].gen&&S.qs[id].st===1).length;
 if(nAct<3)S.bq.forEach(d=>{opts.push({l:t('bTake',{q:qName(d.id),r:qRewards(d.id).join(' · ')}),f:()=>{S.bqa=S.bqa||{};S.bqa[d.id]=d;S.bq=S.bq.filter(x=>x!==d);acceptQ(d.id);}});});
 Object.keys(QD).forEach(id=>{if(QD[id].by==='board'&&!QD[id].gen&&qAvail(id)&&S.lv>=(QD[id].lv||1))opts.push({l:t('bTake',{q:qName(id),r:qRewards(id).join(' · ')}),f:()=>acceptQ(id)});});
 opts.push({l:t('oLeave')});dialog('board',[nAct>=3?'bFull':'bdHi'],null,opts.slice(0,9));}
function npcMark(id){const mine=Object.keys(QD).filter(q=>QD[q].by===id);if(mine.some(qReady))return['?','#ffd23a'];if(mine.some(q=>qAvail(q)&&S.lv>=(QD[q].lv||1)))return['!','#ffd23a'];if(mine.some(q=>S.qs[q]&&S.qs[q].st===1))return['?','#8aa0c0'];return null;}
function shopD(who,line){const n=NPCT[who],o=n.opts?n.opts():[];dialog(who,[line],null,o.length?[...o,{l:t('oLeave')}]:null);}
function talkNPC(id){if(id==='board')return openBoard();
 if(S.cls==='smith'&&(id==='khan'||id==='smith')){const ch=id==='khan'?['kh1','kh2']:['sm1','sm2'];const sk=ch.filter(q=>!qDone(q));if(sk.length){sk.forEach(q=>S.qs[q]={st:2,c:0});S.met[id]=1;save(true);return dialog(id,[id==='khan'?'kh_sk':'sm_sk']);}}const n=NPCT[id]||{},mine=Object.keys(QD).filter(q=>QD[q].by===id);
 const rd=mine.find(qReady);if(rd)return dialog(id,[rd+'_d'],()=>completeQ(rd));
 const av=mine.find(q=>qAvail(q)&&S.lv>=(QD[q].lv||1));
 if(av){const lines=[];if(n.hi&&!S.met[id])lines.push(n.hi);S.met[id]=1;lines.push(t(av+'_o')+'\n'+t('rwLine',{r:qRewards(av).join(' · ')}));return dialog(id,lines,null,[{l:t('qAccept'),f:()=>acceptQ(av)},{l:t('qDecline')}]);}
 const ac=mine.find(q=>S.qs[q]&&S.qs[q].st===1);if(ac)return dialog(id,[ac+'_w']);
 let line=mine.some(qAvail)&&n.low?n.low:n.idle?n.idle():'oLeave';if(n.hi&&!S.met[id]){S.met[id]=1;line=n.hi;}
 shopD(id,line);}
function buyMat(who,k,g){if(S.gold<g){SFX.deny();return dialog(who,[t('noGold')]);}S.gold-=g;S.mats[k]=(S.mats[k]||0)+1;SFX.coin();num(P.x,P.y-26,'-'+g+'G','#f2c14e',false);toast(t('got',{n:1,item:t(k)}));hudDirty=true;shopD(who,S.cls==='smith'&&who!=='merchant'?'kh_s3':'mHi');}
function sellMats(who,k,n,g){S.mats[k]-=n;S.gold+=g;coinFx(npcOf(who),g);toast(t('soldM',{n,it:t(k),g}),'good');hudDirty=true;shopD(who,'mHi');}
const MATP={wood:2,ore:3,leather:4,mstone:12};
function buyGear(id,g){if(S.gold<g){SFX.deny();return dialog('armorer',['arNo']);}S.gold-=g;const it=mkItem(id,0);S.items.push(it);SFX.coin();toast(t('gotItem',{it:inm(it)}),'good');hudDirty=true;shopD('armorer','arBuy');}
