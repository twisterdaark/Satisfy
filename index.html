<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Satisfy Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one full-window 16:9 stage; pixel canvas underneath, HTML system windows (manhwa-style) on top */
:root{
  --bg:#06070c; --sys:rgba(14,26,54,.9); --sys2:rgba(10,18,40,.96); --line:#7fb4ff; --ink:#eaf2ff; --muted:#9db0cf;
  --gold:#f2c14e; --hp:#d8423a; --st:#e8c547; --food:#d9842b; --xp:#7f6bff;
  --r0:#d9d9d9; --r1:#5aa2ff; --r2:#b07bff; --r3:#ff9a3d; --r4:#ffc21a;
  --ar-body:"Tajawal",system-ui,sans-serif; --ar-head:"Lalezar","Tajawal",system-ui,sans-serif;
  --en-body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif; --en-head:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{color:var(--ink)}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);outline:none;background:#000;box-shadow:0 0 0 1px #1d2440}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*1.45);line-height:1.4;font-family:var(--body)}
#ui[lang=ar]{--body:var(--ar-body);--head:var(--ar-head)}
#ui[lang=en]{--body:var(--en-body);--head:var(--en-head)}
.sys{background:var(--sys);border:calc(var(--u)*.14) solid var(--line);border-radius:calc(var(--u)*.5);box-shadow:0 0 calc(var(--u)*1.2) rgba(127,180,255,.3);padding:calc(var(--u)*.8) calc(var(--u)*1.1)}
.head{font-family:var(--head);font-weight:400;color:#bfe0ff;line-height:1.2}
[hidden]{display:none!important}
button{font:inherit;color:var(--ink);background:rgba(40,70,130,.55);border:calc(var(--u)*.12) solid var(--line);border-radius:calc(var(--u)*.4);padding:calc(var(--u)*.5) calc(var(--u)*1.4);cursor:pointer;pointer-events:auto}
button:hover,button:focus-visible{background:rgba(90,140,230,.6);outline:none;box-shadow:0 0 calc(var(--u)*.8) rgba(127,180,255,.6)}
button:disabled{opacity:.4;cursor:default;box-shadow:none;background:rgba(40,50,70,.5)}
/* HUD */
#hud{position:absolute;inset:0}
#stats{position:absolute;inset-inline-start:calc(var(--u)*1);top:calc(var(--u)*1);width:calc(var(--u)*24)}
.nm{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:calc(var(--u)*.3)}
.nm .lv{color:var(--gold)}
.bar{position:relative;height:calc(var(--u)*1.25);background:rgba(0,0,0,.55);border-radius:calc(var(--u)*.25);overflow:hidden;margin-top:calc(var(--u)*.3)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;display:block;transition:width .15s}
.bar span{position:absolute;inset:0;text-align:center;font-size:calc(var(--u)*.95);line-height:calc(var(--u)*1.25);font-weight:700;text-shadow:0 0 3px #000;white-space:nowrap}
.bar.xp{height:calc(var(--u)*.5)}
.gold{margin-top:calc(var(--u)*.4);color:var(--gold);font-weight:700;font-size:calc(var(--u)*1.2)}
#quest{position:absolute;inset-inline-end:calc(var(--u)*1);top:calc(var(--u)*1);width:calc(var(--u)*26)}
#quest .head{font-size:calc(var(--u)*1.6);margin-bottom:calc(var(--u)*.2)}
#qtext.ret{color:var(--gold)}
#belt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*1);display:flex;gap:calc(var(--u)*.6);align-items:center;padding:calc(var(--u)*.5) calc(var(--u)*.8)}
.slot{min-width:calc(var(--u)*5);text-align:center;font-size:calc(var(--u)*1.1);white-space:nowrap}
.slot b{display:block;font-size:calc(var(--u)*.85);color:var(--muted);font-weight:500}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*7.4);background:rgba(0,0,0,.65);padding:calc(var(--u)*.3) calc(var(--u)*1);border-radius:calc(var(--u)*.4);font-weight:700;white-space:nowrap}
#boss{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--u)*1);width:calc(var(--u)*40);text-align:center}
#boss .bar{height:calc(var(--u)*1.5)}
#boss .head{color:#ffb0a6;font-size:calc(var(--u)*1.6)}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--u)*13);display:grid;gap:calc(var(--u)*.4);justify-items:center;width:80%}
.toast{background:rgba(8,14,30,.85);border:1px solid rgba(127,180,255,.5);padding:calc(var(--u)*.3) calc(var(--u)*1.1);border-radius:calc(var(--u)*.4);font-weight:700;animation:tin .25s ease-out}
.toast.warn{border-color:#ff7a6a;color:#ffd0c8}.toast.good{border-color:var(--gold);color:#ffe7a8}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#announce{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--u)*6);width:calc(var(--u)*62);text-align:center;border-color:var(--gold);box-shadow:0 0 calc(var(--u)*2.5) rgba(255,194,26,.55);background:rgba(36,24,6,.92)}
#announce .head{color:var(--gold);font-size:calc(var(--u)*2.1)}
/* panels */
.panel{position:absolute;pointer-events:auto}
#dialog{left:6%;right:6%;bottom:calc(var(--u)*2);min-height:calc(var(--u)*9)}
#dialog .head{font-size:calc(var(--u)*1.9);color:var(--gold)}
#dtext{font-size:calc(var(--u)*1.6);margin-top:calc(var(--u)*.3)}
.more{position:absolute;inset-inline-end:calc(var(--u)*1.2);bottom:calc(var(--u)*.5);color:var(--muted);font-size:calc(var(--u)*1)}
.center{left:50%;top:50%;transform:translate(-50%,-50%)}
#forge,#inv{width:calc(var(--u)*64);max-height:86%;overflow:auto;background:var(--sys2)}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*1);margin-bottom:calc(var(--u)*.6)}
.ptitle .head{font-size:calc(var(--u)*2.2)}
.x{padding:calc(var(--u)*.2) calc(var(--u)*.9)}
.recipe{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*1);padding:calc(var(--u)*.6) 0;border-top:1px solid rgba(127,180,255,.25)}
.recipe .rn{font-weight:700;font-size:calc(var(--u)*1.5)}
.recipe .req{color:var(--muted);font-size:calc(var(--u)*1.1)}
.req .ok{color:#9fe39a}.req .no{color:#ff9a8a}
#mg .head{font-size:calc(var(--u)*1.9)}
.mgbar{position:relative;height:calc(var(--u)*3);margin:calc(var(--u)*1.2) 0 calc(var(--u)*.6);background:linear-gradient(90deg,#4a1712,#9a3f1a 35%,#9a3f1a 65%,#4a1712);border:calc(var(--u)*.15) solid #000;border-radius:calc(var(--u)*.4);direction:ltr}
.mgbar .good{position:absolute;inset-block:0;background:rgba(240,150,60,.75)}
.mgbar .perf{position:absolute;inset-block:0;background:var(--gold);box-shadow:0 0 calc(var(--u)*1) var(--gold)}
.mgbar .cur{position:absolute;top:calc(var(--u)*-.8);bottom:calc(var(--u)*-.8);width:calc(var(--u)*.5);margin-left:calc(var(--u)*-.25);background:#fff;box-shadow:0 0 calc(var(--u)*.7) #fff}
.mgrow{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*1);flex-wrap:wrap}
.heat{flex:1;min-width:calc(var(--u)*18)}
.heat .bar i{background:linear-gradient(90deg,#c22,#f80,#ff3)}
.dots{display:flex;gap:calc(var(--u)*.4);direction:ltr}
.dots i{width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);border-radius:50%;background:#2a3350;display:block}
.dots i.p{background:var(--gold)}.dots i.g{background:#e8913a}.dots i.m{background:#6a2a2a}
#fb{font-family:var(--head);font-size:calc(var(--u)*2.6);min-height:calc(var(--u)*3.4);text-align:center;color:var(--gold);text-shadow:0 0 calc(var(--u)*.8) rgba(242,193,78,.7)}
#fb.m{color:#ff8a7a;text-shadow:none}#fb.g{color:#ffb45a}
.mghint{color:var(--muted);text-align:center;font-size:calc(var(--u)*1.15)}
#res{text-align:center;display:grid;gap:calc(var(--u)*.6);justify-items:center}
#res .rname{font-family:var(--head);font-size:calc(var(--u)*3)}
.rt{font-weight:700}.rt0{color:var(--r0)}.rt1{color:var(--r1)}.rt2{color:var(--r2)}.rt3{color:var(--r3)}.rt4{color:var(--r4);text-shadow:0 0 calc(var(--u)*.8) rgba(255,194,26,.6)}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:calc(var(--u)*1.5)}
.cols>div{min-width:0}
.sub{color:var(--muted);font-weight:700;margin:calc(var(--u)*.4) 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*.8);padding:calc(var(--u)*.45) 0;border-top:1px solid rgba(127,180,255,.2)}
.item small{display:block;color:var(--muted);font-size:calc(var(--u)*1)}
.item button{padding:calc(var(--u)*.2) calc(var(--u)*.8);font-size:calc(var(--u)*1.1)}
.kv{display:flex;justify-content:space-between;padding:calc(var(--u)*.2) 0}
.kv b{color:var(--gold)}
/* screens */
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);background:radial-gradient(ellipse at center,rgba(6,8,16,.35),rgba(4,5,10,.85))}
.logo{text-align:center;line-height:1}
.logo .l1{font-family:"Press Start 2P",monospace;font-size:calc(var(--u)*5.2);color:var(--gold);letter-spacing:.06em;text-shadow:0 calc(var(--u)*.4) 0 #7a4a10,0 0 calc(var(--u)*2.5) rgba(242,193,78,.45)}
.logo .l2{font-family:var(--head);font-size:calc(var(--u)*2.8);color:#eaf2ff;margin-top:calc(var(--u)*1.4)}
.logo .l3{font-family:"Press Start 2P",monospace;font-size:calc(var(--u)*.9);color:var(--line);margin-top:calc(var(--u)*1);letter-spacing:.2em}
.menu{display:grid;gap:calc(var(--u)*.7);width:calc(var(--u)*26)}
.menu button{font-size:calc(var(--u)*1.7);padding:calc(var(--u)*.6)}
.langs{display:flex;gap:calc(var(--u)*2)}
.langs button{width:calc(var(--u)*20);padding:calc(var(--u)*1.2);font-size:calc(var(--u)*2.4)}
.langs button[data-l=ar]{font-family:var(--ar-head)}.langs button[data-l=en]{font-family:var(--en-head)}
.bil{font-size:calc(var(--u)*1.6);color:var(--muted);text-align:center}
.bil span{display:block}
.bil .ar{font-family:var(--ar-body)}.bil .en{font-family:var(--en-body)}
#controls{width:calc(var(--u)*46)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*.35) calc(var(--u)*1.5);margin:calc(var(--u)*.8) 0}
kbd{font-family:"Press Start 2P",monospace;font-size:calc(var(--u)*.85);background:#1b2440;border:1px solid var(--line);border-radius:calc(var(--u)*.3);padding:calc(var(--u)*.3) calc(var(--u)*.5);direction:ltr;display:inline-block;white-space:nowrap}
#end .head{font-size:calc(var(--u)*3);color:var(--gold)}
#end p{max-width:calc(var(--u)*55);text-align:center;margin:0}
.foot{position:absolute;bottom:calc(var(--u)*1);color:var(--muted);font-size:calc(var(--u)*.95)}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="stage" tabindex="0">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="ui" lang="ar" dir="rtl">
    <div id="hud" hidden>
      <div id="stats" class="sys">
        <div class="nm"><span data-i18n="pname"></span><span class="lv" id="lv"></span></div>
        <div class="bar"><i id="hpb" style="background:var(--hp)"></i><span id="hpt"></span></div>
        <div class="bar"><i id="stb" style="background:var(--st)"></i><span id="stt"></span></div>
        <div class="bar"><i id="fdb" style="background:var(--food)"></i><span id="fdt"></span></div>
        <div class="bar xp"><i id="xpb" style="background:var(--xp)"></i></div>
        <div class="gold" id="goldt"></div>
      </div>
      <div id="quest" class="sys"><div class="head" data-i18n="questH"></div><div id="qtext"></div></div>
      <div id="boss" class="sys" hidden><div class="head" data-i18n="golem"></div><div class="bar"><i id="bossb" style="background:linear-gradient(90deg,#8f1d17,#e2493a)"></i><span id="bosst"></span></div></div>
      <div id="belt" class="sys">
        <div class="slot"><span id="breadt"></span><b>1</b></div>
        <div class="slot"><span id="weapt"></span><b data-i18n="weapon"></b></div>
        <div class="slot"><span id="armt"></span><b data-i18n="armor"></b></div>
        <div class="slot"><span>I</span><b data-i18n="bag"></b></div>
        <div class="slot"><span>Esc</span><b data-i18n="menu"></b></div>
      </div>
      <div id="hint" hidden></div>
      <div id="toasts"></div>
      <div id="announce" class="sys" hidden><div class="head" data-i18n="worldNotice"></div><div id="anntext"></div></div>
    </div>

    <div id="dialog" class="sys panel" hidden><div class="head" id="dname"></div><div id="dtext"></div><div class="more" data-i18n="next"></div></div>

    <div id="forge" class="sys panel center" hidden>
      <div class="ptitle"><span class="head" data-i18n="anvil"></span><button class="x" data-act="closeForge">✕</button></div>
      <div id="rlist"></div>
      <div id="mg" hidden>
        <div class="head" id="mgname"></div>
        <div class="mgbar"><div class="good" id="mgood"></div><div class="perf" id="mperf"></div><div class="cur" id="mcur"></div></div>
        <div id="fb"></div>
        <div class="mgrow"><div class="heat"><span data-i18n="heat"></span><div class="bar"><i id="heatb"></i><span id="heatt"></span></div></div><div class="dots" id="dots"></div></div>
        <p class="mghint" data-i18n="mgHint"></p>
      </div>
      <div id="res" hidden></div>
    </div>

    <div id="inv" class="sys panel center" hidden>
      <div class="ptitle"><span class="head" data-i18n="bagT"></span><button class="x" data-act="closeInv">✕</button></div>
      <div class="cols"><div><div class="sub" data-i18n="gear"></div><div id="items"></div></div><div><div class="sub" data-i18n="charT"></div><div id="char"></div><div class="sub" data-i18n="mats"></div><div id="mats"></div></div></div>
    </div>

    <div id="langScreen" class="screen">
      <div class="logo"><div class="l1">SATISFY</div><div class="l3">PROTOTYPE</div></div>
      <div class="bil"><span class="ar" dir="rtl">اختار اللغة</span><span class="en">Choose your language</span></div>
      <div class="langs"><button data-l="ar">العربية</button><button data-l="en">English</button></div>
    </div>

    <div id="titleScreen" class="screen" hidden>
      <div class="logo"><div class="l1">SATISFY</div><div class="l2" data-i18n="subtitle"></div><div class="l3">PROTOTYPE v0.1</div></div>
      <div class="menu">
        <button data-act="new" data-i18n="newGame"></button>
        <button data-act="cont" id="contBtn" data-i18n="cont"></button>
        <button data-act="controls" data-i18n="controls"></button>
        <button data-act="lang" data-i18n="langBtn"></button>
      </div>
      <div class="foot" data-i18n="fanNote"></div>
    </div>

    <div id="pauseScreen" class="screen" hidden>
      <div class="logo"><div class="l2" data-i18n="paused"></div></div>
      <div class="menu">
        <button data-act="resume" data-i18n="resume"></button>
        <button data-act="controls" data-i18n="controls"></button>
        <button data-act="swapLang" data-i18n="langSwap"></button>
        <button data-act="quit" data-i18n="saveQuit"></button>
      </div>
    </div>

    <div id="controlsScreen" class="screen" hidden>
      <div id="controls" class="sys">
        <div class="head" style="font-size:calc(var(--u)*2.2)" data-i18n="controls"></div>
        <div class="keys">
          <span><kbd>W A S D</kbd> <kbd>↑ ↓ ← →</kbd></span><span data-i18n="kMove"></span>
          <span><kbd>J</kbd> <kbd>Click</kbd></span><span data-i18n="kAtk"></span>
          <span><kbd>Space</kbd></span><span data-i18n="kDodge"></span>
          <span><kbd>E</kbd></span><span data-i18n="kUse"></span>
          <span><kbd>I</kbd></span><span data-i18n="kInv"></span>
          <span><kbd>1</kbd></span><span data-i18n="kEat"></span>
          <span><kbd>Esc</kbd></span><span data-i18n="kMenu"></span>
        </div>
        <button data-act="back" data-i18n="back"></button>
      </div>
    </div>

    <div id="end" class="screen" hidden>
      <div class="head" data-i18n="endT"></div>
      <p data-i18n="endP"></p>
      <button data-act="keepPlaying" data-i18n="keep"></button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=480,H=270,TS=16,MW=64,MH=44;
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');ctx.imageSmoothingEnabled=false;
const stage=document.getElementById('stage'),UI=document.getElementById('ui');
const $=id=>document.getElementById(id);
function fit(){const s0=Math.min(innerWidth/W,innerHeight/H);const s=s0>=2?Math.floor(s0*4)/4:s0;const w=Math.round(W*s),h=Math.round(H*s);stage.style.width=w+'px';stage.style.height=h+'px';stage.style.setProperty('--u',(w/100)+'px');}
addEventListener('resize',fit);fit();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const R=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const rand=Math.random;

/* ---------------- i18n ---------------- */
let lang='ar';
const STR={
ar:{pname:'جريد',subtitle:'سليل باغما',newGame:'لعبة جديدة',cont:'كمّل',controls:'التحكم',langBtn:'اللغة',langSwap:'English',paused:'اللعبة واقفة',resume:'كمّل اللعب',saveQuit:'احفظ واخرج',back:'رجوع',
 kMove:'الحركة',kAtk:'هجوم',kDodge:'تفادي (بيستهلك طاقة)',kUse:'كلام / تعدين / السندان',kInv:'الشنطة',kEat:'كُل عيش',kMenu:'القايمة',
 fanNote:'نسخة تجريبية من صنع معجبين، مستوحاة من Overgeared',questH:'الكويست',weapon:'السلاح',armor:'الدرع',bag:'الشنطة',menu:'القايمة',next:'E / Space ←',
 hp:'صحة',st:'طاقة',food:'شبع',lv:'لفل {n}',gold:'{n} دهب',golem:'جولم الكهف',worldNotice:'إشعار للعالم كله',
 khan:'خان الحداد',baker:'الخباز',
 k1:'إنت الولد الجديد اللي بيقولوا عليه؟ استنى... إيدك عليها علامة غريبة.',
 k2:'دي علامة باغما! أعظم حداد في تاريخ Satisfy. يعني إنت... سليله؟',
 k3:'مش هصدق غير لما أشوف. هاتلي 5 خام حديد من الغابة اللي في الشرق.',
 kq1:'حديد كويس. يلا على السندان اللي جنبي، واطرق لما المؤشر يدخل المنطقة الدهبية.',
 kq2:'مش بطال لأول مرة! بس السلاح محتاج جلد لمقبضه. اصطاد 3 ذئاب في عمق الغابة وهاتلي جلدين.',
 kq3:'دلوقتي اسمع كويس. في الكهف اللي في آخر الطريق شرق، فيه جولم بيحرس سر باغما. اهزمه وهات قلبه.',
 kq4:'قلب الجولم... ده اللي باغما كان بيصنع بيه! اصنع بيه نصل باغما على السندان. دي أصعب صنعة في حياتك.',
 kq5:'مش مصدق عيني... إنت فعلا سليل باغما. قريب العالم كله هيعرف اسمك.',
 kwait:'لسه مخلصتش اللي طلبته يا ابني. بص على الكويست فوق.',

 setT(ANVIL.tx,ANVIL.ty,BL);setT(WELL.tx,WELL.ty,BL);

function hitBox(x,y,r){return solidT(Math.floor((x-r)/TS),Math.floor((y-3)/TS))||solidT(Math.floor((x+r)/TS),Math.floor((y-3)/TS))||solidT(Math.floor((x-r)/TS),Math.floor((y+2)/TS))||solidT(Math.floor((x+r)/TS),Math.floor((y+2)/TS));}
function move(e,dx,dy,r){if(dx&&!hitBox(e.x+dx,e.y,r))e.x+=dx;if(dy&&!hitBox(e.x,e.y+dy,r))e.y+=dy;}

function tryAttack(ax,ay){

  if(w.id==='pagma'&&w.r===4){S.hits++;if(S.hits%4===0){dmg*=2;burn=true;}}

  num(m.x,my-8,String(dmg),crit||burn?'#ffd24a':'#ffffff',crit||burn);

 row.innerHTML=`<div><span class="rt rt${i.r}">${t(i.id)}</span><small>${t('r'+i.r)} · ${st}</small></div>`;const b=document.createElement('button');b.textContent=eq?t('equipped'):t('equip');b.disabled=eq;b.onclick=()=>{if(i.slot==='w')S.eqW=i.uid;else S.eqA=i.uid;hudDirty=true;renderInv();};row.appendChild(b);it.appendChild(row);});
 const kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;
 $('char').innerHTML=kv(t('cls'),t('clsV'))+kv(t('title'),S.title?t('titleV'):t('noTitle'))+kv(t('lv',{n:''}).trim(),S.lv)+kv(t('smith'),S.smith)+kv(t('atk'),atkV())+kv(t('def'),defV());
 $('mats').innerHTML=['ore','leather','gel','core','bread'].map(k=>kv(t(k),k==='bread'?S.bread:(S.mats[k]||0))).join('');}

/* ---------------- ui helpers ---------------- */
function toast(msg,cls){const el=document.createElement('div');el.className='toast'+(cls?' '+cls:'');el.textContent=msg;const box=$('toasts');box.appendChild(el);while(box.children.length>4)box.firstChild.remove();setTimeout(()=>el.remove(),2600);}
let annT=0;function announce(msg){$('anntext').textContent=msg;$('announce').hidden=false;annT=5;}
function num(x,y,s,c,big){nums.push({x,y,s,c,big,t:.9});}
function updateHUD(){const mh=maxHP();P.hp=Math.min(P.hp,mh);
 $('lv').textContent=t('lv',{n:S.lv});$('hpb').style.width=(P.hp/mh*100)+'%';$('hpt').textContent=`${t('hp')} ${Math.ceil(P.hp)}/${mh}`;
 $('stb').style.width=P.st+'%';$('stt').textContent=`${t('st')} ${Math.round(P.st)}%`;$('fdb').style.width=P.food+'%';$('fdt').textContent=`${t('food')} ${Math.round(P.food)}%`;
 $('xpb').style.width=(S.xp/xpNeed()*100)+'%';$('goldt').textContent=t('gold',{n:S.gold});
 const [qt,ret]=questText();$('qtext').textContent=qt;$('qtext').className=ret?'ret':'';
 $('breadt').textContent=`${t('bread')} ×${S.bread}`;const w=weapon();$('weapt').innerHTML=`<span class="rt rt${w.r}">${t(w.id)}</span>`;const a=armorIt();$('armt').innerHTML=a?`<span class="rt rt${a.r}">${t(a.id)}</span>`:t('none');
 const g=mons.find(m=>m.type==='golem');const showB=g&&!g.dead&&inCave()&&Math.hypot(g.x-P.x,g.y-P.y)<220;$('boss').hidden=!showB;if(showB){$('bossb').style.width=(g.hp/g.max*100)+'%';$('bosst').textContent=`${Math.ceil(g.hp)}/${g.max}`;}
 if(mode==='play'){const n=nearest();const h=$('hint');if(n){h.hidden=false;h.textContent=n.k==='npc'?t('hTalk'):n.k==='anvil'?t('hAnvil'):(n.o.dep>0?t('hEmpty'):t('hMine'));}else h.hidden=true;}}

/* ---------------- menus ---------------- */
function showOnly(id){['langScreen','titleScreen','pauseScreen','controlsScreen','end'].forEach(s=>$(s).hidden=s!==id);}
let ctrlBack='titleScreen';
function toTitle(){mode='title';showOnly('titleScreen');$('hud').hidden=true;$('contBtn').disabled=!hasSave();setTimeout(()=>$('titleScreen').querySelector('button:not(:disabled)').focus(),0);}
function startGame(cont){if(!(cont&&load()))freshState();spawnWorld();showOnly(null);$('hud').hidden=false;mode='play';hudDirty=true;stage.focus();if(!cont)toast(t('q0'));}
function openPause(){mode='pause';showOnly('pauseScreen');$('hint').hidden=true;setTimeout(()=>$('pauseScreen').querySelector('button').focus(),0);}
function resume(){showOnly(null);mode='play';stage.focus();}
function act(a){
 if(a==='new')startGame(false);else if(a==='cont')startGame(true);
 else if(a==='controls'){ctrlBack=mode==='pause'?'pauseScreen':'titleScreen';mode='controls';showOnly('controlsScreen');}
 else if(a==='back'){showOnly(ctrlBack);mode=ctrlBack==='pauseScreen'?'pause':'title';}
 else if(a==='lang'){mode='lang';showOnly('langScreen');}
 else if(a==='swapLang'){lang=lang==='ar'?'en':'ar';applyLang();}
 else if(a==='resume')resume();else if(a==='quit'){save(true);toTitle();}
 else if(a==='closeForge')closeForge();else if(a==='closeInv')closeInv();
 else if(a==='keepPlaying'){$('end').hidden=true;$('hud').hidden=false;mode='play';stage.focus();}
}
UI.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.l){lang=b.dataset.l;try{localStorage.setItem('satisfy_lang',lang);}catch(_){}applyLang();toTitle();}else if(b.dataset.act)act(b.dataset.act);});
try{const l=localStorage.getItem('satisfy_lang');if(l)lang=l;}catch(e){}
applyLang();
setTimeout(()=>{const b=document.querySelector(`.langs button[data-l=${lang}]`);if(b)b.focus();},0);

/* ---------------- update ---------------- */
function update(dt){
 gTime+=dt;
 for(const n of nodes)if(n.dep>0)n.dep-=dt;
 if(annT>0){annT-=dt;if(annT<=0)$('announce').hidden=true;}
 if(mode==='forge')updateMG(dt);
 if(Math.random()<dt*2.5)smoke.push({x:CHIM.x+(rand()-.5)*4,y:CHIM.y,t:0});
 smoke.forEach(s=>{s.t+=dt;s.y-=12*dt;s.x+=4*dt;});smoke=smoke.filter(s=>s.t<3);
 fx.forEach(f=>{f.t-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=220*dt;});fx=fx.filter(f=>f.t>0);
 nums.forEach(n=>{n.t-=dt;n.y-=22*dt;});nums=nums.filter(n=>n.t>0);
 if(shake>0)shake-=dt;
 if(mode!=='play')return;
 // player
 const mh=maxHP(),pain=P.hp/mh<.25;
 let ix=(K.right?1:0)-(K.left?1:0),iy=(K.down?1:0)-(K.up?1:0);
 if(P.dash>0){P.dash-=dt;move(P,P.dx*230*dt,P.dy*230*dt,4);}
 else if(ix||iy){const l=Math.hypot(ix,iy);const sp=70*(pain?.75:1)*(P.food<=0?.85:1);move(P,ix/l*sp*dt,iy/l*sp*dt,4);P.at+=dt;P.frame=(P.at*7|0)%2;if(Math.abs(ix)>Math.abs(iy))P.dir=ix>0?2:3;else P.dir=iy>0?0:1;}
 else P.frame=0;
 if(K.atk){const v=[[0,1],[0,-1],[1,0],[-1,0]][P.dir];tryAttack(v[0],v[1]);}
 P.acd-=dt;P.inv-=dt;if(P.slash){P.slash.t-=dt;if(P.slash.t<=0)P.slash=null;}
 P.st=Math.min(100,P.st+(P.food<20?8:20)*dt);
 P.food=Math.max(0,P.food-dt/5);
 if(P.food>30)P.hp=Math.min(mh,P.hp+.7*dt);
 if(P.food<=0){P.hp-=1.2*dt;if(!P.starveT){P.starveT=true;toast(t('starving'),'warn');}if(P.hp<=0)die();}else P.starveT=false;
 if(P.food<20&&!P.hungryT){P.hungryT=true;toast(t('hungry'),'warn');}if(P.food>=25)P.hungryT=false;
 if(pain&&!P.painT){P.painT=true;toast(t('pain'),'warn');}if(!pain)P.painT=false;
 // monsters
 for(const m of mons){
  const b=MT[m.type];
  if(m.dead){m.rt-=dt;if(m.rt<=0&&Math.hypot(m.sx-P.x,m.sy-P.y)>140){Object.assign(m,newMon(m.type,m.sx,m.sy));}continue;}
  m.t+=dt;m.cd-=dt;if(m.hurt>0)m.hurt-=dt;
  const dx=P.x-m.x,dy=P.y-m.y,d=Math.hypot(dx,dy);
  if(m.type==='golem'){
   if(!inCave()){const hx=m.sx-m.x,hy=m.sy-m.y,hd=Math.hypot(hx,hy);if(hd>2)move(m,hx/hd*30*dt,hy/hd*30*dt,10);m.hp=Math.min(m.max,m.hp+25*dt);m.tele=0;continue;}
   const enr=m.hp<m.max/2;
   if(m.tele>0){m.tele-=dt;if(m.tele<=0){shake=.35;if(d<48)hurtPlayer(26);for(let i=0;i<24;i++){const a=rand()*6.28;fx.push({x:m.x+Math.cos(a)*30,y:m.y+Math.sin(a)*18,vx:Math.cos(a)*40,vy:-rand()*60,t:.5,c:'#8a8f99'});}m.scd=enr?1.7:2.6;}}
   else{if(d>14)move(m,dx/d*(enr?30:20)*dt,dy/d*(enr?30:20)*dt,10);m.scd-=dt;if(m.scd<=0&&d<72)m.tele=.9;}
   if(d<b.r+6&&m.cd<=0){hurtPlayer(b.dmg);m.cd=1.1;}
   m.face=dx>0?1:-1;continue;}
  if(d<b.aggro){const hop=m.type==='slime'?(Math.sin(m.t*5)>0?1.6:0):1;if(d>6)move(m,dx/d*b.spd*hop*dt,dy/d*b.spd*hop*dt,b.r-2);m.face=dx>0?1:-1;}
  else{m.wt-=dt;if(m.wt<=0){m.wt=1+rand()*2.5;const back=Math.hypot(m.sx-m.x,m.sy-m.y)>50;if(back){const l=Math.hypot(m.sx-m.x,m.sy-m.y);m.wx=(m.sx-m.x)/l;m.wy=(m.sy-m.y)/l;}else if(rand()<.5){m.wx=0;m.wy=0;}else{const a=rand()*6.28;m.wx=Math.cos(a);m.wy=Math.sin(a);}}
   const hop=m.type==='slime'?(Math.sin(m.t*5)>0?1.4:0):.5;move(m,m.wx*b.spd*.5*hop*dt,m.wy*b.spd*.5*hop*dt,b.r-2);if(m.wx)m.face=m.wx>0?1:-1;}
  if(d<b.r+6&&m.cd<=0){hurtPlayer(b.dmg);m.cd=1;}
 }
}

/* ---------------- render ---------------- */
const darkC=mk(W,H,()=>{}),dg=darkC.getContext('2d');
function drawSlime(x,y,m){const sq=Math.abs(Math.sin(m.t*5));const w=14+sq*2,h=9-sq*2;ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x-7,y-1,14,2);blob(ctx,x,y-h/2-1,w/2,h/2+.5,m.hurt>0?'#ffffff':'#2f8a7c');blob(ctx,x,y-h/2-1.5,w/2-1,h/2-.5,m.hurt>0?'#ffffff':'#5fc6b4');R(ctx,x-4,y-h,3,2,'#b8f4ea');R(ctx,x-3,y-h/2-1,2,2,'#123');R(ctx,x+2,y-h/2-1,2,2,'#123');}
function drawWolf(x,y,m){const f=m.face,leg=(Math.sin(m.t*12)>0)?1:0,c=m.hurt>0?'#ffffff':'#7a7a86',dk=m.hurt>0?'#ffffff':'#55555f',lt='#a8a8b4';
 ctx.save();ctx.translate(x,0);ctx.scale(f,1);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-8,y-1,16,2);
 R(ctx,-8,y-10,13,6,dk);R(ctx,-7,y-11,11,6,c);R(ctx,-6,y-7,9,2,lt);R(ctx,-12,y-12,5,2,c);R(ctx,-13,y-13,2,2,c);
 R(ctx,3,y-14,7,6,c);R(ctx,9,y-11,3,3,c);R(ctx,11,y-11,1,1,'#1a1420');R(ctx,4,y-16,2,2,dk);R(ctx,7,y-16,2,2,dk);R(ctx,7,y-12,1,1,'#e2331f');
 R(ctx,-6,y-5,2,4+leg,dk);R(ctx,-2,y-5,2,4-leg,dk);R(ctx,1,y-5,2,4+leg,dk);R(ctx,4,y-5,2,4-leg,dk);ctx.restore();}
function drawGolem(x,y,m){const enr=m.hp<m.max/2,M=m.hurt>0?'#ffffff':'#7d8a96',L='#a9b6c2',D=m.hurt>0?'#ffffff':'#55606b';const sh=Math.round(Math.sin(m.t*2));y+=sh;
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x-20,y-2,40,4);
 R(ctx,x-12,y-14,9,14,D);R(ctx,x+3,y-14,9,14,D);R(ctx,x-14,y-36,28,24,M);R(ctx,x-14,y-36,28,2,L);R(ctx,x-9,y-48,18,13,M);R(ctx,x-9,y-48,18,2,L);
 const arm=m.tele>0?-6:0;R(ctx,x-22,y-34+arm,8,20,D);R(ctx,x+14,y-34+arm,8,20,D);R(ctx,x-24,y-16+arm,11,8,M);R(ctx,x+13,y-16+arm,11,8,M);
 R(ctx,x-4,y-30,8,7,'#3c2a5a');R(ctx,x-3,y-29,6,5,enr?'#ff5a7a':'#9a5cff');R(ctx,x-2,y-24,1,10,'#3a434c');R(ctx,x+6,y-22,1,8,'#3a434c');
 const e=.7+.3*Math.sin(m.t*6);ctx.globalAlpha=e;R(ctx,x-6,y-43,4,2,enr?'#ff5a5a':'#5ff3ff');R(ctx,x+2,y-43,4,2,enr?'#ff5a5a':'#5ff3ff');ctx.globalAlpha=1;}
function drawNode(x,y,n){if(n.dep>0){R(ctx,x-5,y-3,10,3,'#6a6560');R(ctx,x-3,y-4,4,2,'#7f7a76');return;}ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x-7,y-1,14,2);blob(ctx,x,y-5,7,5,'#55504c');blob(ctx,x,y-6,6,4,'#7f7a76');R(ctx,x-3,y-9,4,2,'#9a958f');R(ctx,x-3,y-6,2,2,'#c8743a');R(ctx,x+2,y-7,2,2,'#d9894a');R(ctx,x,y-4,2,1,'#c8743a');}
function render(){
 const sx=shake>0?(rand()-.5)*4:0,sy=shake>0?(rand()-.5)*4:0;
 let tx,ty;if(mode==='lang'||mode==='title'||(mode==='controls'&&ctrlBack==='titleScreen')){tx=8*TS+Math.sin(gTime*.08)*120+120;ty=14*TS;}else{tx=P.x-W/2;ty=P.y-H/2-8;}
 camX=Math.round(clamp(tx,0,MW*TS-W)+sx);camY=Math.round(clamp(ty,0,MH*TS-H)+sy);
 ctx.drawImage(groundC,camX,camY,W,H,0,0,W,H);
 ctx.save();ctx.translate(-camX,-camY);
 const fl=.5+.5*Math.sin(gTime*9)*Math.sin(gTime*3.7);
 R(ctx,FURN.x+2,FURN.y+4,18,14,fl>.5?'#ff8a1e':'#ffa83a');R(ctx,FURN.x+6,FURN.y+9,10,9,'#ffe07a');for(let i=0;i<5;i++)R(ctx,FURN.x+3+i*3,FURN.y+10-((Math.sin(gTime*10+i*2)*3+3)|0),3,8,'#ff7a1a');
 const ents=[];
 if(S){nodes.forEach(n=>ents.push({y:n.y,f:()=>drawNode(n.x,n.y,n)}));
  npcs.forEach(n=>ents.push({y:n.y,f:()=>{drawChar(n.id,n.x,n.y,n.dir,0,false);if(n.id==='khan'&&S.q<6&&mode!=='lang'&&mode!=='title'){const b=Math.round(Math.sin(gTime*4)*1.5);const rd=qReady();R(ctx,n.x-1,n.y-25+b,3,6,rd?'#ffd23a':'#8aa0c0');R(ctx,n.x-1,n.y-18+b,3,2,rd?'#ffd23a':'#8aa0c0');}}}));
  mons.forEach(m=>{if(m.dead)return;if(m.type==='golem'&&m.tele>0){const k=1-m.tele/.9;ctx.fillStyle=`rgba(255,60,40,${.15+k*.25})`;ctx.beginPath();ctx.ellipse(m.x,m.y,48*k+4,28*k+3,0,0,7);ctx.fill();ctx.strokeStyle='rgba(255,120,90,.9)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(m.x,m.y,48,28,0,0,7);ctx.stroke();}
   ents.push({y:m.y,f:()=>{if(m.type==='slime')drawSlime(Math.round(m.x),Math.round(m.y),m);else if(m.type==='wolf')drawWolf(Math.round(m.x),Math.round(m.y),m);else drawGolem(Math.round(m.x),Math.round(m.y),m);
    if(m.type!=='golem'&&m.hp<m.max){R(ctx,m.x-8,m.y-(m.type==='wolf'?20:14),16,2,'#000');R(ctx,m.x-8,m.y-(m.type==='wolf'?20:14),16*m.hp/m.max,2,'#e2493a');}}});});
  if(mode!=='lang'&&mode!=='title'&&!(mode==='controls'&&ctrlBack==='titleScreen'))ents.push({y:P.y,f:()=>{drawChar('player',P.x,P.y,P.dir,P.frame,P.inv>0&&((gTime*20|0)%2===0)&&P.dash<=0);
   const w=weapon();const wc=['#c8c8cc','#9ac4ff','#d0a8ff','#ffc080','#ffe07a'][w.r];if(!P.slash){const hx=Math.round(P.x)+(P.dir===3?-6:5),hy=Math.round(P.y)-7;if(P.dir!==1){R(ctx,hx,hy-6,1,7,wc);R(ctx,hx-1,hy,3,1,'#7a5634');}}}});}
 ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
 if(P&&P.slash&&mode!=='title'){const w=weapon();const k=P.slash.t/.14;ctx.strokeStyle=w.r===4?`rgba(255,200,60,${k})`:`rgba(255,255,255,${k})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y-7,13,P.slash.a-1.1,P.slash.a+1.1);ctx.stroke();ctx.lineWidth=1;ctx.strokeStyle=`rgba(255,255,255,${k*.5})`;ctx.beginPath();ctx.arc(P.x,P.y-7,9,P.slash.a-.8,P.slash.a+.8);ctx.stroke();}
 ctx.drawImage(overC,camX,camY,W,H,camX,camY,W,H);
 smoke.forEach(s=>{ctx.globalAlpha=Math.max(0,.45-s.t*.15);ctx.fillStyle='#c8c8c8';const r=2+s.t*2.5;ctx.fillRect(Math.round(s.x-r),Math.round(s.y-r),Math.round(r*2),Math.round(r*2));});ctx.globalAlpha=1;
 ctx.globalCompositeOperation='lighter';const gl=ctx.createRadialGradient(FURN.x+11,FURN.y+12,2,FURN.x+11,FURN.y+12,40);gl.addColorStop(0,`rgba(255,120,30,${.32+fl*.1})`);gl.addColorStop(1,'rgba(255,80,10,0)');ctx.fillStyle=gl;ctx.fillRect(FURN.x-30,FURN.y-28,82,82);ctx.globalCompositeOperation='source-over';
 fx.forEach(f=>R(ctx,f.x,f.y,f.t>.2?2:1,f.t>.2?2:1,f.c));
 ctx.textAlign='center';nums.forEach(n=>{ctx.font=(n.big?'10':'8')+'px "Press Start 2P", monospace';ctx.globalAlpha=Math.min(1,n.t*2);ctx.fillStyle='#000';ctx.fillText(n.s,Math.round(n.x)+1,Math.round(n.y)+1);ctx.fillStyle=n.c;ctx.fillText(n.s,Math.round(n.x),Math.round(n.y));});ctx.globalAlpha=1;
 ctx.restore();
 if(P&&S&&mode!=='title'&&mode!=='lang'){const k=clamp((P.x-49*TS)/40,0,1);if(k>0){dg.globalCompositeOperation='source-over';dg.clearRect(0,0,W,H);dg.fillStyle=`rgba(6,4,14,${.8*k})`;dg.fillRect(0,0,W,H);dg.globalCompositeOperation='destination-out';const px=P.x-camX,py=P.y-8-camY,g=dg.createRadialGradient(px,py,10,px,py,95);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');dg.fillStyle=g;dg.fillRect(0,0,W,H);ctx.drawImage(darkC,0,0);}
  if(P.hp/maxHP()<.25){const pv=.35+.15*Math.sin(gTime*4);const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.6);vg.addColorStop(0,'rgba(160,0,0,0)');vg.addColorStop(1,`rgba(170,10,10,${pv})`);ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);}}
}

/* ---------------- loop ---------------- */
freshState();spawnWorld();S.__demo=true;
let last=performance.now(),hudT=0,saveT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();
 if(mode==='play'||mode==='forge'||mode==='inv'||mode==='dialog'){hudT-=dt;if(hudT<=0||hudDirty){updateHUD();hudT=.1;hudDirty=false;}saveT+=dt;if(saveT>20&&mode==='play'){saveT=0;save(true);}}
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__G={get S(){return S},get P(){return P},get mode(){return mode},mons:()=>mons,nodes,act,setQ,finishMG:()=>finishMG,get MG(){return MG}};
})();
</script>
