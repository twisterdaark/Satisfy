<style>
/* Layout: one full-window 16:9 stage; pixel canvas underneath, HTML system windows (manhwa-style) on top */
:root{
  --bg:#06070c; --sys:rgba(10,32,64,.84); --sys2:rgba(6,18,40,.95); --line:#8fd8ff; --glow:rgba(90,190,255,.32); --ink:#eaf2ff; --muted:#9db0cf;

  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

#game{position:absolute;left:0;top:0;image-rendering:pixelated;will-change:transform;image-rendering:crisp-edges;display:block}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*1.45);line-height:1.4;font-family:var(--body)}
#ui[lang=ar]{--body:var(--ar-body);--head:var(--ar-head)}

.sys{position:relative;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),linear-gradient(180deg,rgba(16,46,88,.88),rgba(6,18,40,.92));border:1px solid rgba(143,216,255,.7);border-radius:2px;box-shadow:0 0 calc(var(--u)*1) var(--glow),inset 0 0 calc(var(--u)*1.6) rgba(90,190,255,.12);padding:calc(var(--u)*.8) calc(var(--u)*1.1)}
.sys::before,.sys::after{content:"";position:absolute;width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);border:2px solid #dff6ff;pointer-events:none;filter:drop-shadow(0 0 3px #8fd8ff)}

button:active{transform:scale(.96)}

/* HUD */
#hud{position:absolute;inset:0}
#stats{position:absolute;inset-inline-start:calc(var(--u)*1);top:calc(var(--u)*1);width:calc(var(--u)*24)}

#mg .head{font-size:calc(var(--u)*1.9)}

/* patch 1 */

 for(let y=2;y<WH-2;y++)for(let x=25;x<28;x++)if(Math.abs(y-20.5)>2.6&&r()<.1)setT(x,y,TR);
 [[2,8],[8,6],[12,8],[26,14],[2,30],[11,32],[18,34],[24,32],[26,38],[11,39],[19,40],[10,27]].forEach(([x,y])=>setT(x,y,TR));
 for(let y=31;y<41;y++)for(let x=1;x<12;x++){const dx=(x-6)/3.8,dy=(y-36)/2.8;if(dx*dx+dy*dy<1)setT(x,y,WA);}

 for(let y=2;y<WH-2;y++)for(let x=50;x<MW-2;x++)setT(x,y,r()<.55?TR:GR);
 for(let x=50;x<57;x++)for(let y=19;y<23;y++)setT(x,y,GR);
 for(let y=8;y<23;y++)for(let x=54;x<58;x++)setT(x,y,GR);
 for(let y=2;y<17;y++)for(let x=49;x<62;x++){const dx=x-56,dy=y-9;if(dx*dx+dy*dy<34)setT(x,y,r()<.12?FL:GR);}

 buildings.forEach(b=>{for(let y=b.y+2;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)setT(x,y,BL);});
 setT(ANVIL.tx,ANVIL.ty,BL);setT(WELL.tx,WELL.ty,BL);

const CAVE={sx:5*TS+8,sy:53*TS+8,book:{x:51*TS+8,y:50*TS+10},torches:[]};
function genCave(){

 let cy=53;for(let x=8;x<44;x++){if(x>36)cy+=Math.sign(53-cy);else if(x%6===0)cy+=(x%12===0?-2:2);cy=clamp(cy,50,56);for(let d=-1;d<=1;d++)carve(x,cy+d);if(x%9===4){carve(x,cy+2);carve(x+1,cy+2);}if(x%5===2)CAVE.torches.push({x:x*TS+8,y:(cy-2)*TS+12});}

 setT(50,50,BL);setT(51,50,BL);setT(52,50,BL);
 CAVE.torches=CAVE.torches.filter(t=>at(Math.floor(t.x/TS),Math.floor(t.y/TS))===CW);
}

/* ---------------- update ---------------- */
function update(dt){
 gTime+=dt;
 for(const n of nodes)if(n.dep>0)n.dep-=dt;
 if(annT>0){annT-=dt;if(annT<=0)$('announce').hidden=true;}
 if(mode==='forge')updateMG(dt);
 movers=movers.filter(m=>{const dx=m.x-m.e.x,dy=m.y-m.e.y,d=Math.hypot(dx,dy);if(d<1.5){m.e.x=m.x;m.e.y=m.y;m.e.frame=0;m.r();return false;}const s=Math.min(d,m.sp*dt);m.e.x+=dx/d*s;m.e.y+=dy/d*s;m.e.at=(m.e.at||0)+dt;m.e.frame=(m.e.at*7|0)%2;m.e.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?2:3):(dy>0?0:1);return true;});
 spotK+=(spot-spotK)*Math.min(1,dt*3);
 if(P&&P.cc>0&&rand()<dt*16){const pts=[];let x=P.x+(rand()-.5)*90,y=camY-4;const n=7;for(let i=0;i<=n;i++){pts.push([x,y]);x+=(P.x-x)/(n-i||1)+(rand()-.5)*14;y+=(P.y-8-y)/(n-i||1);}fx.push({bolt:pts,t:.12});if(rand()<.3){shake=.1;noise(.15,.12,2000);}}
 if(Math.random()<dt*2.5)smoke.push({x:CHIM.x+(rand()-.5)*4,y:CHIM.y,t:0});
 smoke.forEach(s=>{s.t+=dt;s.y-=12*dt;s.x+=4*dt;});smoke=smoke.filter(s=>s.t<3);
 fx.forEach(f=>{f.t-=dt;if(f.ring||f.bolt||f.arc)return;if(f.dl>0)f.dl-=dt;else if(f.home&&P){const dx=P.x-f.x,dy=P.y-12-f.y,d=Math.hypot(dx,dy)||1;f.vx=f.vx*.9+dx/d*28;f.vy=f.vy*.9+dy/d*28;f.x+=f.vx*dt;f.y+=f.vy*dt;if(d<5)f.t=0;return;}f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.fl?-12:220)*dt;});fx=fx.filter(f=>f.t>0);
 nums.forEach(n=>{n.t-=dt;n.y-=22*dt;});nums=nums.filter(n=>n.t>0);
 if(shake>0)shake-=dt;
 if(mode==='dead'&&P){P.deadT-=dt;$('deadP').textContent=t('deadP',{n:Math.max(1,Math.ceil(P.deadT))});if(P.deadT<=0)respawn();}
 if(P){P.trail.forEach(a=>a.t-=dt);P.trail=P.trail.filter(a=>a.t>0);}
 for(const m of mons)if(m.dead&&m.dying>0)m.dying-=dt;
 if(mode!=='play')return;
 // player
 const mh=maxHP(),pain=P.hp/mh<.25;
 let ix=(K.right?1:0)-(K.left?1:0),iy=(K.down?1:0)-(K.up?1:0);
 if(P.dash>0){P.dash-=dt;move(P,P.dx*230*dt,P.dy*230*dt,4);P.trail.push({x:P.x,y:P.y,dir:P.dir,frame:P.frame,t:.22});}
 else if(ix||iy){const l=Math.hypot(ix,iy);const sp=66*(1+Math.min(.4,stat('agi')*.005))*(pain?(S.tl.legend?.82:.7)+S.hid.comp*.005:1)*(P.food<=0?.85:1);move(P,ix/l*sp*dt,iy/l*sp*dt,4);P.at+=dt;P.frame=(P.at*7|0)%2;if(Math.abs(ix)>Math.abs(iy))P.dir=ix>0?2:3;else P.dir=iy>0?0:1;}
 else P.frame=0;
 if(K.atk){const v=[[0,1],[0,-1],[1,0],[-1,0]][P.dir];tryAttack(v[0],v[1]);}
 P.acd-=dt;P.inv-=dt;P.dcd-=dt;S.immT-=dt;P.scd-=dt;P.c1-=dt;P.c2-=dt;P.mp=Math.min(maxMP(),P.mp+1.2*dt);if(P.rage>0){P.rage-=dt;if(rand()<dt*20)fx.push({x:P.x+(rand()-.5)*10,y:P.y-rand()*16,vx:0,vy:-30,t:.5,c:'#ff5a3a',fl:1});}if(P.slash){P.slash.t-=dt;if(P.slash.t<=0)P.slash=null;}
 P.st=Math.min(maxST(),P.st+(P.food<20?8:20)*dt);
 if(!S.pro)P.food=Math.max(0,P.food-dt/5);
 if(P.food>30)P.hp=Math.min(mh,P.hp+.7*dt);
 if(P.food<=0){P.hp-=1.2*dt;if(!P.starveT){P.starveT=true;toast(t('starving'),'warn');}if(P.hp<=0)die();}else P.starveT=false;
 if(P.food<20&&!P.hungryT){P.hungryT=true;toast(t('hungry'),'warn');}if(P.food>=25)P.hungryT=false;
 if(pain&&!P.painT){P.painT=true;toast(t('pain'),'warn');}if(!pain)P.painT=false;
 // monsters
 for(const m of mons){
  const b=MT[m.type];
  if(m.dead){m.rt-=dt;if(m.rt<=0&&Math.hypot(m.sx-P.x,m.sy-P.y)>140){Object.assign(m,newMon(m.type,m.sx,m.sy));}continue;}
  m.t+=dt;m.cd-=dt;if(m.hurt>0)m.hurt-=dt;if(m.stun>0){m.stun-=dt;continue;}
  const dx=P.x-m.x,dy=P.y-m.y,d=Math.hypot(dx,dy);
  if(m.type==='guardian'){
   if(!inCave()){const hx=m.sx-m.x,hy=m.sy-m.y,hd=Math.hypot(hx,hy);if(hd>2)move(m,hx/hd*30*dt,hy/hd*30*dt,10);m.hp=Math.min(m.max,m.hp+25*dt);m.tele=0;continue;}
   const enr=m.hp<m.max/2;
   if(m.tele>0){m.tele-=dt;if(m.tele<=0){shake=.4;SFX.slam();if(d<48)hurtPlayer(110,m.lv);slamAllies(m);for(let i=0;i<24;i++){const a=rand()*6.28;fx.push({x:m.x+Math.cos(a)*30,y:m.y+Math.sin(a)*18,vx:Math.cos(a)*40,vy:-rand()*60,t:.5,c:'#8a8f99'});}m.scd=enr?1.7:2.6;}}
   else{if(d>14)move(m,dx/d*(enr?30:20)*dt,dy/d*(enr?30:20)*dt,10);m.scd-=dt;if(m.scd<=0&&d<72)m.tele=.9;}
   if(d<b.r+6&&m.cd<=0){hurtPlayer(b.dmg,m.lv);m.cd=1.1;}
   m.face=dx>0?1:-1;continue;}
  const safe=P.x<27.5*TS&&P.y<WH*TS;
  if(d<b.aggro&&!safe){if(d>6)move(m,dx/d*b.spd*dt,dy/d*b.spd*dt,b.r-2);m.face=dx>0?1:-1;}
  else{m.wt-=dt;if(m.wt<=0){m.wt=1+rand()*2.5;const back=Math.hypot(m.sx-m.x,m.sy-m.y)>50;if(back){const l=Math.hypot(m.sx-m.x,m.sy-m.y);m.wx=(m.sx-m.x)/l;m.wy=(m.sy-m.y)/l;}else if(rand()<.5){m.wx=0;m.wy=0;}else{const a=rand()*6.28;m.wx=Math.cos(a);m.wy=Math.sin(a);}}
   move(m,m.wx*b.spd*.25*dt,m.wy*b.spd*.25*dt,b.r-2);if(m.wx)m.face=m.wx>0?1:-1;}
  if(d<b.r+6&&m.cd<=0){hurtPlayer(b.dmg,m.lv);m.cd=1;}
 }
 updateAllies(dt);
}

/* ---------------- guardian raid with the hunting party ---------------- */
function startRaid(){S.raid=1;const r=npcOf('recruiter');allies=['hunter','recruiter','hunter'].map((id,i)=>({id,x:r.x+(i-1)*12,y:r.y+10,dir:2,frame:0,at:0,hp:420,max:420,cd:rand(),off:[[-18,8],[18,8],[0,20]][i]}));SFX.quest();dialog('recruiter',['rRaid']);}
function updateAllies(dt){if(!allies.length)return;const g=mons.find(m=>m.type==='guardian');
 allies.forEach(a=>{if(a.dead)return;const fight=g&&!g.dead&&inCave()&&Math.hypot(g.x-a.x,g.y-a.y)<220;const tx=fight?g.x+a.off[0]:P.x+a.off[0],ty=fight?g.y+a.off[1]:P.y+a.off[1];
  const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);if(d>260){a.x=P.x+a.off[0];a.y=P.y+a.off[1];}else if(d>4){const sp=d>70?95:62;a.x+=dx/d*Math.min(d,sp*dt);a.y+=dy/d*Math.min(d,sp*dt);a.at+=dt;a.frame=(a.at*7|0)%2;a.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?2:3):(dy>0?0:1);}else{a.frame=0;if(fight)a.dir=g.x>a.x?2:3;}
  a.cd-=dt;if(fight&&Math.hypot(g.x-a.x,g.y-a.y)<44&&a.cd<=0){a.cd=1.1;const dm=Math.round(55*(.9+rand()*.2));g.hp-=dm;g.hurt=.1;num(g.x+(rand()-.5)*20,g.y-50,String(dm),'#bfe8ff',false);noise(.05,.15,800);fx.push({x:g.x,y:g.y-30,vx:(rand()-.5)*60,vy:-40,t:.3,c:'#fff'});if(g.hp<=0)killMon(g);}});
 if(g&&g.dead&&S.raid===0&&allies.length&&!allies.leaving){allies.leaving=1;setTimeout(()=>{allies=[];},4000);}}
function slamAllies(m){allies.forEach(a=>{if(!a.dead&&Math.hypot(a.x-m.x,a.y-m.y)<48){a.hp-=140;num(a.x,a.y-26,'-140','#ff6a5a',false);if(a.hp<=0){a.dead=1;dissolve(a.x,a.y-8,['#fff','#bfe8ff'],20);}}});}

const miniBase=mk(MW,WH,g=>{for(let y=0;y<WH;y++)for(let x=0;x<MW;x++){const v=at(x,y);g.fillStyle=v===TR?'#1f4a24':v===PA?'#a8875a':v===WA?'#3b74b4':v===BL?'#8a5a44':'#4b8b3f';g.fillRect(x,y,1,1);}});

function drawMini(){const c=$('mini');const show=!miniOff&&S&&!S.pro&&!$('hud').hidden;c.hidden=!show;if(!show)return;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(miniBase,0,0,128,88);
 const dot=(x,y,col,s=2)=>{g.fillStyle=col;g.fillRect(Math.round(x/TS*2-s/2),Math.round(y/TS*2-s/2),s,s);};
 npcs.forEach(n=>dot(n.x,n.y,'#ffd23a'));R(g,ANVIL.tx*2,ANVIL.ty*2,2,2,'#bfe8ff');mons.forEach(m=>{if(!m.dead)dot(m.x,m.y,m.type==='guardian'?'#c050ff':'#e2493a',m.type==='guardian'?4:2);});allies.forEach(a=>{if(!a.dead)dot(a.x,a.y,'#5ad06a');});
 if((gTime*3|0)%2)dot(P.x,P.y,'#ffffff',3);}

/* ---------------- music: small synthesized loops per area ---------------- */
let musicG=null,mStep=0,mNext=0,mTrack='';
const TRACKS={
 village:{bpm:96,root:220,w:'triangle',v:.05,mel:[12,null,16,null,19,null,16,null,14,null,12,null,9,null,null,null,12,null,16,null,19,null,21,null,19,null,16,null,14,null,null,null],bass:[0,null,null,null,7,null,null,null,5,null,null,null,7,null,null,null]},
 forest:{bpm:80,root:146.8,w:'sine',v:.05,mel:[12,null,null,15,null,19,null,null,17,null,15,null,14,null,10,null,12,null,null,15,null,17,null,null,19,null,22,null,19,null,null,null],bass:[0,null,null,null,null,null,null,null,-2,null,null,null,null,null,null,null]},
 boss:{bpm:150,root:82.4,w:'square',v:.035,mel:[24,null,27,null,31,null,30,27,24,null,22,null,24,null,null,null],bass:[0,0,12,0,0,0,12,0,3,3,15,3,5,5,17,5]},
 cave:{bpm:70,root:110,w:'sine',v:.045,mel:[null,null,null,null,15,null,null,null,null,null,14,null,null,null,null,null,null,null,null,null,12,null,null,null,11,null,null,null,null,null,null,null],bass:[0,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]}};
function mtone(f,d,type,v,t0){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+.02);g.gain.exponentialRampToValueAtTime(.0005,t0+d);o.connect(g);g.connect(musicG);o.start(t0);o.stop(t0+d+.05);}
function musicTick(){if(!ac||muted||!musicOn)return;if(!musicG){musicG=ac.createGain();musicG.gain.value=1;musicG.connect(master);}
 const want=mode==='lang'||mode==='title'?'village':S&&S.pro?'cave':!$('boss').hidden?'boss':P&&P.x>27.5*TS?'forest':'village';if(want!==mTrack){mTrack=want;mStep=0;}
 const tr=TRACKS[mTrack],sd=60/tr.bpm/2;if(mNext<ac.currentTime-.5)mNext=ac.currentTime+.05;
 while(mNext<ac.currentTime+.2){const m=tr.mel[mStep%tr.mel.length],b=tr.bass[mStep%tr.bass.length];if(m!=null)mtone(tr.root*Math.pow(2,m/12),sd*1.8,tr.w,tr.v,mNext);if(b!=null)mtone(tr.root/2*Math.pow(2,b/12),sd*(mTrack==='boss'?1:6),mTrack==='boss'?'sawtooth':'triangle',tr.v*.8,mNext);mStep++;mNext+=sd;}}

 requestAnimationFrame(loop);}
