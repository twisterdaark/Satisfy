Patrian without fear.",q_fp1:"Boars in the Crops",fp1_o:"Crimson Tusk boars are eating the crops. Kill 6 before the harvest.",fp1_w:"The boars are in the highlands north of the wall.",fp1_d:"The crops are saved. Bless you.",q_fp2:"Blankets for Winter",fp2_o:"Winter is harsh here. Bring me 10 leather to make blankets for the children.",fp2_w:"I still need the leather.",fp2_d:"The children will sleep warm. Thank you.",q_hp1:"Snow Bears",hp1_o:"The great snow bears are coming down from the north. Kill 6 and the Earl will reward you.",hp1_w:"The bears are in the snowfields north of the highlands.",hp1_d:"A real hunter. Take this.",guardW:"Winston Gate Guard",hunter:"Hunter",pedW:"Travelling Peddler",pedE:"Travelling Peddler",farmerP:"Patrian Farmer",hunterP:"Patrian Hunter",gw_idle:"No one passes this gate without me seeing.",hn_idle:"The fields are full of game if you keep your eyes open.",fp_idle:"The soil here is good, but the beasts are many.",hp_idle:"The highlands teach you patience.",ped_hi:"Welcome, traveller! It's a long road. Take some potions and bread.",oQuestAsk:"Any work? ({q})",piaro:"Piaro",pi_hi:"Hello, young one. I'm a simple farmer now, but once I held a sword.",pi_idle:"The soil teaches patience. Want an old man's advice?",oPiaro:"Any advice, Piaro?",pi_t1:"The body is like a field. Water one patch and leave the other, and the crop leans and falls.",pi_t2:"Strength without agility is slow and never lands, and agility without strength never cuts. A sword needs both.",pi_t3:"Whoever finds the balance between their strength and their speed, their body thanks them. Find it yourself.",pi_good:"You see? Your body is balanced. Keep it so.",pi_off:"Your body leans, child. One part runs far ahead of the other.",balLearn:"Learned: Piaro's Ratio (Strength : Stamina = 1:1)",secondWind:"Second Wind! Your balanced body rises again",balL:"Piaro's Balance",balOn:"Active",balOff:"Inactive",balD:"While Strength and Stamina stay within 10% of each other (both 20+): +8% damage and +8% max HP, faster stamina recovery, cheaper dodges, and Second Wind when health runs low (once a minute)",advL:"Advancement",advT:"[ {n} Advancement! Your body broke through its limit. All stats increased. ]",advD:"+{n} to every stat, and +{p}% to all stats",ord1:"First",ord2:"Second",ord3:"Third",ord4:"Fourth",ord5:"Fifth",ord6:"Sixth",ord7:"Seventh",ord8:"Eighth",ord9:"Ninth",cl_gknight:"Guardian Knight",tk:"Knight Trainer",tk_hi:"A guardian knight stands in front of everyone. Come back at level {lv}.",q_ck:"Trial of the Shield",ck_o:"A true knight never runs. Block 15 hits with your guard (right click) and come back.",ck_w:"Not yet. Raise your guard and take the blows.",ck_d:"You are a real shield. From today you are a Guardian Knight.",o_block:"Block hits with your guard: {c}/{n}",sk_bash:"Shield Bash",skd_bash:"Slam everything in front with your shield for 120% and stun them for a second.",sk_fort:"Fortress",skd_fort:"5 s: your guard cannot break and covers every side, and each blocked hit sends 30% back at the attacker.",sk_taunt:"Taunt",skd_taunt:"Every monster nearby comes for you; you take 20% less damage for 6 s and heal a little per monster.",fortOn:"Fortress! Your guard cannot break",tauntN:"Taunted {n} monsters",mastH:"Weapon Mastery",mastD:"Every hit trains the weapon in your hand. Each level: +1% damage and slightly faster attacks with that kind.",mastUp:"{w} mastery reached level {n}",q_pt1:"Highland Wolves",q_pt2:"Crimson Tusks",q_pt3:"Armor for Winter",q_pt4:"The Deserter Gang",q_pt5:"Mud Golems",q_pt6:"The Deserter Captain",pt1_o:"Wolves are coming down from the highlands north of town and attacking the carts. Kill 10 of them.",pt1_w:"The wolves are still howling on the road.",pt1_d:"The road is quieter. Take your pay, and come back. There's more work.",pt2:"The Crimson Tusk",pt2_o:"Crimson Tusk boars are breaking the farm fences. Kill 8 before they reach the gate.",pt2_w:"The farmers are still complaining about the boars.",pt2_d:"Clean work. The Earl has heard of you and wants to see you.",pt3:"Hides for the Garrison",pt3_o:"Winter is coming and the guards need leather armor. Bring me 12 leather.",pt3_w:"We still need the leather before the snow.",pt3_d:"The garrison owes you. Patrian doesn't forget who stands with it.",pt4:"Deserters in the Marsh",pt4_o:"Soldiers who fled the army have formed a gang in Ashur Marsh, south of town. Kill 10 of them.",pt4_w:"The deserters are still robbing the caravans.",pt4_d:"You hit them where it hurts. But their captain still lives, and the Earl will speak with you.",pt5:"Bog Golems",pt5_o:"The deserters hide behind mud golems that wake in the marsh. Break 6 of them so we can reach the captain.",pt5_w:"The golems still guard the way.",pt5_d:"The road to the old tower is open. The captain is hiding there.",pt6:"The Deserter Captain",pt6_o:"The deserters' captain holds the Old Watchtower east of the wall. He was one of my best knights. Kill him and come back.",pt6_w:"His banner still flies over the tower.",pt6_d:"He was my friend once. Patrian is safe thanks to you, and your name goes in the town's records.",w1:"Satisfy. A virtual reality game with over two billion players, so real it became a second life.",w2:"{n} logged in for the first time in Winston, a city of the Eternal Kingdom. No class, level 1, and everything still ahead.",w3:"They say a player called Grid found a legendary class a while ago... just rumors.",zWin:"Winston",zFields:"Winston Fields",zCamp:"Goblin Camp",zBai:"Bairan Village",zGrey:"Grey Forest (Lv 96+)",zGuard:"Guardian's Den",zRoad:"Bairan Road",zQuarry:"Quarry",enterZ:"Entered: {z}",smith:"Smith the Blacksmith",grid:"Grid",regas:"Regas",tw:"Warrior Trainer",ta:"Archer Trainer",tm:"Magic Instructor",board:"Quest Board",merchant:"Winston Merchant",coachW:"Winston Coachman",rabbitN:"Wild Rabbit",goblinN:"Goblin",gchiefN:"Goblin Chief",mstone:"Mana Stone",bow:"Hunter's Bow",staff:"Novice Staff",hammer:"Smith's Hammer",cl_novice:"Novice",cl_warrior:"Warrior",cl_archer:"Archer",cl_mage:"Magician",cl_smith:"Blacksmith",clsGot:"[Class change: {c}]",q_kh1:"Firewood for the Forge",q_kh2:"Iron Ore",q_kh3:"Your First Sword",q_kh4:"Leather Armor",q_cw:"Warrior's Trial",q_ca:"Archer's Trial",q_cm:"Magician's Trial",q_cb:"Blacksmith's Trial",q_bnt:"Bounty: Goblin Chief",q_hunt:"Clear the Fields",q_sm1:"[Chop Firewood]",q_sm2:"[Mine Iron Ore]",q_sm3:"[Create a Jaffa Arrow]",o_have:"Bring {it}: {c}/{n}",o_kill:"Defeat {it}: {c}/{n}",o_craft:"Craft {it}: {c}/{n}",o_craftR:"Craft any Rare or better item: {c}/{n}",retTo:"Return to {w}",noQuest:"No quests right now. Talk to people with a ! above them",qNew:"New quest: {q}",qDone:"Quest complete: {q}",qAccept:"Accept",qDecline:"Not now",qReward:"Reward: {r}",needLv:"Requires level {n}",kh_hi:"Hm? A new player? This is Khan's smithy, and I don't like people touching my anvil.",kh1_o:"If you want to learn, start at the bottom. The furnace needs wood. Bring me 6 pieces from the trees in town.",kh1_w:"You haven't brought the wood yet.",kh1_d:"Not bad. Fine, you can use the anvil. Just don't break it.",kh2_o:"A smith without iron is useless. There are ore rocks in the fields east of town. Bring me 5.",kh2_w:"The ore is in the eastern fields. Watch out for goblins.",kh2_d:"Good iron. Let's see your hands. Make an iron sword on the anvil.",kh3_o:"Forge an iron sword. Heat, hammer, quench. Each stage has its moment.",kh3_w:"The sword isn't made yet.",kh3_d:"...Not bad for a beginner. I've hammered iron for forty years. I know hands with a future.",kh4_o:"War isn't just swords. Make leather armor. Wild rabbits drop leather.",kh4_w:"Still no armor.",kh4_d:"Now you can head into the fields with some peace of mind. If you want to be a real blacksmith, come back at level 5.",kh_idle:"The anvil is waiting. A real smith never stops hammering.",kh_grid:"Grid? I've heard of him... that kid has strange hands. One day he'll surpass me.",cb_o:"You want to be a blacksmith? Craft an item of Rare quality or better, and I'll teach you the secrets of the trade.",cb_w:"You haven't made anything Rare yet.",cb_d:"Those are a smith's hands. From today you are a blacksmith. Smiths reach ratings no one else can.",tw_hi:"The sword is no toy, kid. Come back at level {lv}.",trOther:"You are already training with another trainer. Finish with them first.",trDone:"I have nothing for you right now. Keep training out there.",cw_o:"Prove you are no coward. Defeat 5 goblins in the eastern fields.",cw_w:"The goblins still live.",cw_d:"That's a warrior! Take this, and always stand in the front line.",ta_hi:"An archer's eye matters more than the hand. Come back at level {lv}.",ca_o:"Hunt 8 wild rabbits. Speed is everything.",ca_w:"Still short on rabbits.",ca_d:"Hawk eyes! This bow is yours now.",tm_hi:"Mana flows through everything. Come to me at level {lv}.",cm_o:"The goblins steal mana stones. Bring me 3 of them.",cm_w:"I need 3 mana stones.",cm_d:"You can feel the mana... take this staff. Welcome to the path of magic.",clsTaken:"You already have a class.",bnt_o:"[Bounty] The Goblin Chief raids caravans south-east of the fields. Reward: 120 gold.",bnt_w:"[Bounty] The Goblin Chief still lives.",bnt_d:"[Bounty] Done! 120 gold added to your bag.",hunt_o:"[Task] Goblins are multiplying. Defeat 10 of them.",hunt_w:"[Task] There are still goblins.",hunt_d:"[Task] Thank you, adventurer!",board_idle:"[Quest Board] No tasks available right now.",sm_hi:"Who are you? A rude kid walking into my smithy like that? ...Fine, if you want to learn, first you chop firewood.",sm1_o:"Take this old axe. Chop 10 pieces of firewood from the village trees.",sm1_w:"The firewood isn't done yet.",sm1_d:"What? That fast? ...You're not ordinary.",sm2_o:"Bring me 8 iron ore from the quarry behind the smithy.",sm2_w:"The quarry is behind the smithy.",sm2_d:"That breaks my record! How are you like this?",sm3_o:"I'll teach you Jaffa arrows. Make 5 bundles, and we'll split them half and half.",sm3_w:"Still no arrows.",sm3_d:"...These are masterpieces. I'm taking all of them, sorry. Take this money instead.",sm_idle:"You remind me of Pagma himself... get back to work.",grid1:"What? You want something? I'm busy. And if you want a weapon, the prices are high.",grid2:"People think smithing is easy... every strike on the anvil hurts.",grid3:"Saw the notice? Yeah, that was me. I won't tell you how.",rg_hi:"I'm Regas. Our party hunts in the Grey Forest. We have Blue Orichalcum from the Guardian raid if you want to buy.",rRaidNo:"Join us? At level {lv}? You'd die in a second. Come back at level 90.",oTravelW:"Travel to Winston ({g} gold)",oTravelB:"Travel to Bairan ({g} gold)",coachHi:"It's a dangerous route, and the beasts around Bairan are over level 100. 200 gold a trip; we arrive by morning.",noGold:"You don't have enough gold.",mHi:"Welcome to Winston! Bread and goods, and I buy Jaffa arrows.",noAnvil:"Don't touch my anvil without my permission! Do what I tell you first.",annGrid:"Grid, Pagma's Successor, forged the first Legendary item in Satisfy's history!",sk_strike:"Power Strike",skd_strike:"A strike dealing 180% damage.",sk_whirl:"Whirlwind",skd_whirl:"Spin and hit everything around you for 150%.",sk_charge:"Charge",skd_charge:"Dash forward, dealing 200% and stunning.",sk_rapid:"Rapid Shot",skd_rapid:"Three arrows in quick succession.",sk_pierce:"Piercing Arrow",skd_pierce:"An arrow that passes through all enemies, 220%.",sk_rain:"Arrow Rain",skd_rain:"Arrows rain on an area ahead, 140% each.",sk_fireball:"Fireball",skd_fireball:"A fireball that explodes for 240% in an area.",sk_nova:"Frost Nova",skd_nova:"Freezes nearby enemies for 2 seconds.",sk_bolt:"Lightning Bolt",skd_bolt:"Lightning strikes a line ahead for 300%.",sk_smash:"Hammer Smash",skd_smash:"220% damage and stuns the target.",sk_focus:"Craftsman's Focus",skd_focus:"Your next craft is easier and better.",sk_rage:"Blacksmith's Rage",skd_rage:"+30% damage and +25% attack speed for 10s.",sk_roar:"Forest Roar",skd_roar:"Stuns nearby monsters for 2.5s.",sk_cry:"Chief's Cry",skd_cry:"Terrifies nearby monsters.",skCost:"{mp} MP · {cd}s cooldown",skUnlock:"Unlocks at level {n}",skTitle:"Title skill",skBar:"Skills",rebind:"Skill keys",pressKey:"Press a key...",keyTaken:"That key is taken",resetKeys:"Reset",focusOn:"Craftsman's Focus: next craft improved",noTitles:"You have no titles yet. Titles come from achievements in the world.",tl_chief:"Goblin Chief Slayer",tl_chiefD:"+30 HP.",tl_chiefS:"Active skill: Chief's Cry.",tl_hunter:"Field Hunter",tl_hunterD:"+10% damage.",newTitleX:"Title gained: {t} (press C)",pickT:"Choose {s}",nothingFit:"Nothing in your bag fits here",unequip:"Unequip",mapT:"[ Map ]",mapYou:"You",mapNpc:"People",mapMon:"Monsters",mapQ:"Quest",mapAnvil:"Anvil",kMap:"Map",oneShot:"The monsters here are extremely high level!",needBow:"This skill needs a bow",needStaff:"This skill needs a staff",needMelee:"This skill needs a sword or hammer",noEffect:"NO EFFECT",hRead:"E: Read",arrived:"Arrived at {z}",mapHint:"Wheel or + / -: zoom · drag to pan · 0: centre on you · M or Esc: close",mapMe:"Find me",skNone:"No skills yet. The first one unlocks at level 2.",skSlotE:"Empty slot",gotItem:"Received: {it}",introTip:"Talk to Khan at his smithy on East Street, and check the map (M)",wk_sword:"Sword · uses STR",wk_bow:"Bow · uses DEX",wk_staff:"Staff · uses INT",wk_hammer:"Hammer · uses STR",wk_spear:"Spear · uses STR, longer reach",wk_dagger:"Dagger · uses DEX, more crits",mapZone:"You are in: {z}",tlHunt:"Field Hunter",hTravel:"E: Travel",mBuy:"Buy bread (5 gold)",clsNow:"Your class: {c}",slot6:"Title slot",hEnter:'E: Enter',hChest:'E: Open chest',hShelf:'E: Read a book',hBed:'E: Bed',bedNo:"That's not your bed.",bedInn:'These beds are for guests. Talk to the innkeeper.',chestE:'The chest is empty.',chestO:'You found {g} gold and some things in the chest!',insiUp:'Insight has risen by 1.',shelfN:'Bookshelf',
bk1:'"Pagma, the Legendary Blacksmith. He said smithing must benefit people, not be sold to whoever pays most."',bk2:'"The Eternal Kingdom: the north is Earl Steim\'s land, and Winston is the most important town in it."',bk3:'"The beasts around Bairan move on instinct and are very fast. No one below level 120 should leave alone."',bk4:'"The Grey Forest\'s golems guard something. They say blue orichalcum forms from moonlight."',bk5:'"The frostlight orcs live in the northern snowfields. Their hide keeps out the cold."',bk6:'"Ratings: Normal, Rare, Epic, Unique, Legendary. A legendary appears once in a lifetime."',boarN:'Wild Boar',gbearN:'Giant Brown Bear',mermanN:'Lake Merman',pwolfN:'Plains Wolf',outlawN:"Winston's Outlaw",pragaN:"Praga, Winston's Outlaw",forcN:'Frostlight Orc',fochiefN:'Frostlight Orc Chief',golemN:'Golem',cgolemN:'Crystal Golem',
zOut:'Bairan Outskirts (Lv 100+)',zPlains:'Central Plains',zSnow:'Northern Snowfields',zOrc:'Frostlight Orc Village',zLake:'The Lake',zHide:"Outlaws' Hideout",zCanyon:'Goblin Canyon',zGrave:'North Hill',hGrave:'E: Read the gravestone',graveT:"Here lies Khan's son. The flowers beside it are still fresh...",bq_kill:'Hunt {n} {it}',bq_have:'Bring {n} {it}',bTurn:'Turn in: {q}',bTake:'Take: {q} ({r})',bHi:'[Quest Board] Pick a task. The board refreshes every so often.',bFull:'[Quest Board] You already carry 3 board tasks. Finish one first.',rwH:'Rewards',rwXP:'{n} XP',rwGold:'{n} gold',rwPts:'{n} stat points',rwCls:'New class: {c}',rwItem:'{i}',rwLine:'[ Reward: {r} ]',qdFrom:'From: {w}',qdObj:'Objective',qCancel:'Abandon quest',qCancelSure:'Sure? Click again to abandon',qCanceled:'Quest abandoned: {q}',qdHint:'Click a quest to see its details',eqMark:'Equipped now',deadX:'Lost {x} XP.',deadLv:'Your level dropped to {n}!',deadPick:'Where do you want to respawn?',deadIn:'Respawning in {n}...',goW:"You need {g} gold for the carriage. Walking means crossing Bairan's outskirts, where the beasts are level 100+.",c1:"Satisfy. A virtual reality game with over two billion players.",c2:"Shin Youngwoo, known in the game as Grid. A level 73 warrior with no talent, who dreams of changing his life through the game.",c3:"After three months of travel, he finally reached the Northern End Cave, chasing an S-rank quest from Earl Ashur.",c4:"Grid woke up in the temple of Yatan, the god of darkness. Level -1, 14 health, every stat at 1.",c5:"Later, a careless logout in the middle of a fight dropped him to level -3. Penniless, he reached a remote village called Bairan.",c6:"An old blacksmith named Khan lived there...",skip:"Skip intro",cont2:"Continue",sysN:"System",pq:"[Earl Ashur's Secret Request] (S): find the treasure at the end of the Northern End Cave",pq2:"[Earl Ashur's Anger] (SS): survive Earl Ashur",ashur:"Earl Ashur",knight:"Knight",cwolfN:"Cave Wolf",clsW:"Warrior",g0:"Finally... after three months. The treasure has to be at the end of this cave!",hBook:"E: Examine the book",g1:"This is... the treasure? A book? Let me check it with the Eye of Pallalian.",appr:"[Pagma's Rare Book]\nRating: Legendary\n\"This is a book that contains the techniques of Pagma, the blacksmith who transcended human limits.\"\nEffect: Become Pagma's Successor.\nConditions: None.\n* The level and stats will change when used.",g2:"Legendary?! If I sold this I'd be rich... No, no. It's the Earl's treasure, I have to hand it in for the quest.",ash1:"I knew a rat would find its way to my treasure. You thief... you will pay for this.",g3:"Wait! I came here on your own quest! I'm not a thief!",ash2:"Seize him. No one touches Ashur's treasure and lives.",qc1:"[The quest has changed: Earl Ashur's Anger (SS)]",qc2:"[Affinity with Earl Ashur: -100]",qc3:"[You have been branded a thief in Patrian.]",g4:"The Earl is level 300 and the knights are level 180... Am I going to die here?! I can't even log out...",g5:"It's a legendary class... If I become the strongest class, I might be able to clear this quest!",confirm:"Are you sure you want to use [Pagma's Rare Book]?\nYour level and stats will change.",useY:"Use",useN:"No",gNo:"There's no other way... now it's do or die!",s1:"[Commencing class change.]",s2:"[You have become Pagma's Successor.]",s3:"[Your level has dropped.]",s4:"[You are now level 1.]",s5:"[All stats and skills have been reset.]",s6:"[The Dexterity stat has opened.]",s7:"[All blacksmith skills have been mastered to the pinnacle.]",s8:"[Legendary Blacksmith skills have opened.]",s9:"[Title 'One Who Became a Legend' acquired.]",g6:"Die...!",kn1:"A level 1 insect?",s10:"[You have been hit by a blow!]",s11:"[You have died.]",s12:"[Quest failed!]",s13:"[You will no longer be able to enter Patrian.]",s14:"[Your level has dropped by 2.]",s15:"[You are now level -1.]",gk1:"I'm a blacksmith. Let me work at your smithy, I'll do anything.",gk5:"Just a blacksmith.",kq5b:"Hmph. Test it on the grey wolves in the forest past the east gate, and bring me 2 leather.",bHi:"Fresh bread! 5 gold a loaf.",oBuyBread:"Buy bread (5 gold)",oLeave:"Leave",oSell:"Sell arrows ({n} bundles for {g} gold)",oBlue:"Buy Blue Orichalcum (150 gold)",oRaid:"Join the Guardian of the Forest raid",rHi:"What do you want? We buy Jaffa arrows.",rRaid:"Alright, follow us. The Guardian is at the far end of the north-east forest. Don't die!",rRaidOn:"We're already with you. To the Guardian!",soldT:"Sold {n} arrow bundles for {g} gold",titlesH:"Titles",tl_legend:"One Who Became a Legend",tl_legendD:"You will not die at minimum health (once every 2 minutes). Abnormal conditions such as pain are weaker on you.",tl_smith:"Legendary Blacksmith",tl_smithD:"+10% ATK.",tl_smithS:"",tl_forest:"Guardian Slayer",tl_forestD:"+15% damage to beasts.",tl_forestS:"Active skill: Forest Roar.",tlNote:"Title effects are always active. The title you wear puts its skill in the last slot of the skill bar.",tlLocked:"??? (not unlocked yet)",tlWear:"Wear",tlWorn:"Worn",kQ:"Title",kSkill:"Skill bar",noSkill:"Your worn title has no active skill",rageOn:"Blacksmith's Rage!",roarOn:"Forest Roar!",noMP:"Not enough MP",mp:"MP",newTitleForest:"Title gained: Guardian Slayer (press C)",skLink:"Pagma's Swordsmanship: Link",skLinkD:"Three linked slashes while stepping forward, 150% each. 10 MP, 8s cooldown.",skKill:"Pagma's Swordsmanship: Kill",skKillD:"One devastating strike, 400% damage. 18 MP, 15s cooldown.",skNew:"New skill unlocked: {s} (key {k})",skLocked:"This skill is still locked",skillsH:"Skills",kSk1:"Link skill",kSk2:"Kill skill",kU:"Gear",kL:"Log",kM:"Map",kTab:"Quests",eqT:"[ Equipment ]",helm:"Helmet",gloves:"Gloves",bootsS:"Boots",acc:"Accessory",evWon:"{z} repelled the invasion! The last wave has fallen",evWaveN:"Wave {n}/{m}",hBChest:"E: Open the boss's chest",hExitD:"E: Leave the dungeon now",dunClear:"Dungeon cleared! The boss's chest and an exit portal appeared",lootXP:"XP",lootGold:"G  Come back at 150.\"",bs2:"\"I am Braham, the greatest magician on the continent. My body died long ago, but my magic is still here. Will you carry it?\"",bsAppr:"[Braham's Legacy]\nRating: Legendary\n\"Whoever takes it becomes Braham's Successor. Only one magician in the world.\"",bsConfirm:"Are you sure you want to take Braham's Legacy? Your class becomes Braham's Successor, and nobody else in the world can take it, and your level returns to 1.",brS1:"[Commencing class change.]",brS2:"[You have become Braham's Successor.]",brPerk:"[Braham's Successor] Keeps every magician spell. +20% damage, and mana returns 2.5 times faster. Braham's Magic: missiles that find their own targets.",annBraham:"{n} has become Braham's Successor! The magic of the continent's greatest magician has returned to the world.",bsTaken:"The place is empty. {n} took Braham's Legacy before you... a legendary class exists only once in the world.",bsDone:"\"My magic is in you now. Do not waste it.\"",bsSealed:"The soul is held behind a seal. The Death Knight still guards it.",cl_braham:"Braham's Successor",sk_bmiss:"Braham's Magic: Missiles",skd_bmiss:"Five magic missiles seek out the nearest monsters on their own, 110% each.",sk_bmeteor:"Braham's Magic: Meteor",skd_bmeteor:"A meteor falls where you aim: 500% damage around it and a stun on everything it touches.",sk_bchain:"Braham's Magic: Chain Lightning",skd_bchain:"Lightning leaps from monster to monster, up to 6, 220% each.",sk_bzero:"Braham's Magic: Absolute Zero",skd_bzero:"Everything around you freezes for 3 seconds, 300% damage.",q_br1:"Spirits of the Tomb",br1_o:"You? Braham's Successor? The books say his cursed spirits still haunt the tomb. Defeat 15 of them and the Meteor will wake inside you.",br1_w:"Braham's Tomb, under the Haalrune Swamp.",br1_d:"Did you feel it? That is the Meteor. Braham burned armies with it.",q_br2:"The Death Knight",br2_o:"The Death Knight was Braham's personal guard. When it falls, the magic it guarded will be freed. Defeat it.",br2_w:"The end of the tomb, before Braham's soul.",br2_d:"The lightning is free. Can you feel it leaping between your fingers?",q_br3:"The Cold Peak",br3_o:"Last lesson: the Frostlight Orc Warlord. When it comes down to the snowfields, defeat it, even alongside others. Whoever stands against a beast like that learns Absolute Zero.",br3_w:"Wait for the Warlord world event in the northern snowfields.",br3_d:"Braham himself would be proud. You are the greatest magician in Satisfy now.",vantner:"Vantner",faker:"Faker",vt_hi:"So you are the one everyone talks about? I'm Vantner, Overgeared's tank. Nothing gets past my shield.",vt_idle:"Army deserters keep harassing merchants on the Patrian road.",fk_hi:"...How did you see me? No one sees me unless I want them to. I'm Faker.",fk_idle:"The Kobold King sits at the bottom of the mine and nobody can take him.",q_cp1:"Regas's Hand",cp1_o:"You've gotten strong. Let's see: defeat 6 golems, and if you can, I'll come with you on your journey.",cp1_w:"Golems roam the northern forest and the mines.",cp1_d:"Alright, my fists are with you from today. Call me whenever you like.",q_cp2:"A Shield on the Road",cp2_o:"Army deserters robbed 3 caravans this week. Defeat 10 of them and I will stand in front of you in any fight.",cp2_w:"Deserters hold the road east of Patrian.",cp2_d:"Now you are one of us. When you need someone to take the hits for you, I am here.",q_cp3:"The Kobold King's Shadow",cp3_o:"You want to walk with me? Defeat the Kobold King at the bottom of the Reidan mines. Come back alive and you have earned it.",cp3_w:"The Kobold King is on the deepest floor of the Reidan mines.",cp3_d:"You came back. Not bad. I will be your shadow from today.",q_cp4:"An Arrow in the Swamp",cp4_o:"The Haalrune lizardmen have grown too many. Defeat 12 of them, and if I like your work I will cover you with my arrows.",cp4_w:"The Haalrune Swamp, south of Reinhardt.",cp4_d:"Nice work. From today my arrows are with you, even if we are not in the same guild.",oCompGo:"Come with me",oCompBye:"Go back to your post",compOn:"{n} is traveling with you.",compOff:"{n} went back.",cpGo_regas:"Let's go! If we find something strong, leave it to me.",cpGo_vantner:"Walk ahead. I will take the hits.",cpGo_faker:"You will not see me, but I will be there.",cpGo_jishuka:"Do not worry. Anything that gets close to you gets an arrow.",cpIdle_regas:"I'm warmed up. Let's find someone to hit.",cpIdle_vantner:"As long as I am next to you, the hits that reach you are lighter.",cpIdle_faker:"...",cpIdle_jishuka:"My eyes are on anything that moves.",cs_regas:"Cyclone Fist",cs_vantner:"Shield Shock",cs_faker:"Shadow Strike",cs_jishuka:"Arrow Rain",sk_wave:"Pagma's Swordsmanship: Wave",skd_wave:"The cut flies forward as a golden crescent that passes through everything ahead, 260% damage.",sk_transcend:"Pagma's Swordsmanship: Transcend",skd_transcend:"One step across the whole line, cutting everything in your path for 350% damage. Nothing can touch you as you cross.",sk_revolve:"Pagma's Swordsmanship: Revolve",skd_revolve:"The sword turns around you five times and draws monsters in, 130% each turn.",sk_pinnacle:"Pagma's Swordsmanship: Pinnacle",skd_pinnacle:"Gather for a moment, then one cut from the peak of the art: 700% damage ahead and a stun on everything it touches.",skNewC:"New skill unlocked: {s}. Your bar is full; place it from the status window (C).",barOn:"Put on bar",barOff:"Take off ({k})",barFull:"Your bar is full. Take a skill off first.",barNote:"The bar holds only 5 skills. Pick the ones that suit you.",q_pg3:"The Sword Was Born in Battle",pg3_o:"Pagma did not learn the sword in a workshop. He learned it protecting people from monsters. Go down to the Haalrune Swamp by Reinhardt, defeat 20 lizardmen, and let the sword find its way.",pg3_w:"The Haalrune Swamp, south of Reinhardt.",pg3_d:"See? The sword is a step ahead of you now. That is Transcend.",q_pg4:"A Sword Against an Army",pg4_o:"A smith like you must stand against many at once. The guild soldiers at the banners fight in squads. Defeat 12 of them.",pg4_w:"The banners at the Goblin Canyon cave, the Reidan road waystation and the mine.",pg4_d:"You turned your sword among them and not one touched you. That is Revolve.",q_pg5:"The Pinnacle",pg5_o:"One thing is left. The Frostlight Orc Warlord comes down to the northern snowfields during world events. Defeat it, even alongside others. Whoever stands against a beast like that reaches the pinnacle of Pagma.",pg5_w:"Wait for the Warlord world event in the northern snowfields.",pg5_d:"Pagma himself never reached this in his life. You are the pinnacle now.",warlordN:"Frostlight Orc Warlord",ev_invW:"Goblin invasion! Goblins are attacking Winston's west gate.",ev_invP:"Army deserters are attacking Patrian's gate!",ev_invR:"Kobolds have come out of the mines and are attacking Reidan!",ev_invK:"Haalrune lizardmen and guild soldiers are attacking Reinhardt's walls!",ev_gold:"Golden hour! Monster XP and gold +50% across the world.",ev_fboss:"The Frostlight Orc Warlord has come down to the northern snowfields!",ev_fishf:"Fishing festival! Golden Fish chance x3.",ev_guildw:"Land war hour! Every banner has lost its shield.",evN_invW:"Winston invasion",evN_invP:"Attack on Patrian",evN_invR:"Attack on Reidan",evN_invK:"Attack on Reinhardt",evN_gold:"Golden hour",evN_fboss:"The Warlord",evN_fishf:"Fishing festival",evN_guildw:"Land war",evKills:"Kills: {n}",evWave:"Invasion wave {n}!",evReward:"Event contribution: {n} monsters. +{g} gold and +{x} XP.",evOver:"Event over: {e}.",evBossDown:"{n} defeated the Frostlight Orc Warlord!",fish:"Fish",sfish:"Snow Trout",gfish:"Golden Fish",herb:"Red Herb",bherb:"Moonflower",fishAny:"fish",cfish:"Grilled Fish",stew:"Herb Fish Stew",feast:"Golden Fish Feast",cfishD:"Food +35 and health +20%.",stewD:"Food +60 and health regeneration for 2 minutes.",feastD:"Full food, +10% damage and +10% XP for 5 minutes.",hFish:"E: Fish",hReel:"E: Reel in!",hHerb:"E: Pick the herb",hPicked:"The herb is still growing back",hCamp:"E: Campfire (cook and brew)",camp:"Campfire",fCast:"You cast the line... wait for a bite.",fEarly:"The fish got away!",fGone:"The fish got away! You had to reel in faster.",fGold:"A Golden Fish! A very rare catch.",campHi:"The fire is going. Cook something, or brew potions?",oCook:"Cook {it} ({n})",oBrew:"Brew {it} ({n})",cookOk:"You cooked {it}!",cookFail:"The food burned...",brewOk:"You brewed {it}!",brewFail:"The potion spoiled...",ateD:"You ate {it}.",bufEnd:"The meal wore off.",lifeH:"Life skills",lifeLvT:"Lv {n}",lifeUp:"{s} reached level {n}!",lifeMD:"Material. Cook or brew it at any campfire, or sell it to a merchant.",life_fish:"Fishing",life_herb:"Herb gathering",life_cook:"Cooking",life_alch:"Brewing",lifeD_fish:"Each level widens the reel-in window and raises the Golden Fish chance.",lifeD_herb:"Each level raises the chance of an extra herb.",lifeD_cook:"Each level lowers the chance of burning food.",lifeD_alch:"Each level lowers the chance of spoiling a potion.",fisher:"Lake Fisherman",herbW:"Winston Herbalist",fi_hi:"This lake has the best fish around. Stand on the shore and press E, and when the float dips, reel in at once.",fi_idle:"Patience is the real fishing rod.",hw_hi:"The red herb heals and the moonflower restores mana. You will find them in the fields and by the water.",hw_idle:"Any campfire will do for brewing, if you know the recipe.",q_lf1:"The Fisherman's Lunch",lf1_o:"My back is bad today. Bring me 5 fish from the lake.",lf1_w:"Stand by the lake water and press E.",lf1_d:"Fresh fish! You have a light touch.",q_lf2:"The Golden Fish",lf2_o:"They say a golden fish shows itself only to patient fishers. Bring me one and you can have what is in my pocket.",lf2_w:"Any water. The higher your fishing level, the better the chance.",lf2_d:"A real golden one! First I have seen in twenty years.",q_lf3:"Herbs for Healing",lf3_o:"Bring me 6 red herbs from the fields. There are many wounded in Winston.",lf3_w:"Red herbs grow in the fields and along the roads between towns.",lf3_d:"Good. These will heal a lot of people.",q_lf4:"Moonflower",lf4_o:"The moonflower glows by the water and in the snow. Bring 4.",lf4_w:"Look near lakes, swamps and the snowy fields.",lf4_d:"Beautiful... now I can make mana potions.",q_lf5:"Grilled Fish for the Inn",lf5_o:"Travellers keep asking for grilled fish and I have no time. Cook me 4 at any campfire.",lf5_w:"Catch fish and cook them at the campfire in any town square or waystation.",lf5_d:"It smells wonderful! The guests will be happy.",zNEnd:"Northern End Cave",zLoran:"The Cave behind Loran Falls",hNEnd:"E: Enter the cave",hFalls:"E: Go behind the falls",hBook:"E: The book",hMural:"E: Look at the mural",pbookN:"Pagma's Rare Book",mural:"Pagma's Mural",cl_pagma:"Pagma's Successor",pb1:"On a stone pedestal at the end of the cave lies an old, dusty book. Heat rises from it like a furnace.",pbAppr:"[Pagma's Rare Book]\nRating: Legendary\n\"This is a book that contains the techniques of Pagma, the blacksmith who transcended human limits.\"\nEffect: Become Pagma's Successor.\nCondition: nobody in the world has become his successor before you.",pbConfirm:"Are you sure you want to use [Pagma's Rare Book]? Your class becomes Pagma's Successor, and nobody else in the world can take it, and your level returns to 1.",pgS1:"[Commencing class change.]",pgS2:"[You have become Pagma's Successor.]",pgPerk:"[Pagma's Successor] Near-total status resistance. Every Rare or better item you forge permanently raises all stats (Rare +2, Epic +4, Legendary +25). Pagma's Swordsmanship: +20% damage and the Link skill.",annPagma:"{n} has become Pagma's Successor! The first legendary class in Satisfy.",pbTaken:"The pedestal is empty. {n} took the book before you... a legendary class exists only once in the world.",pbDone:"The pedestal is empty. What was in the book is part of you now.",pgStat:"Pagma's Successor: all stats +{n} from this piece!",mur1:"An old mural behind the falls: a man dancing with a sword, the blade piercing the sky.",mur2:"Beneath it is written: \"The smith who understands the sword understands how to make it.\"",mur3:"Something is missing... maybe you have to be Pagma's Successor to understand it.",mur3p:"[You understood Pagma's Sword Dance!] Your body remembers the moves on its own.",skQuest:"Unlocks after the quest: {q}",sk_link:"Pagma's Swordsmanship: Link",skd_link:"Three linked slashes while stepping forward, 150% each.",sk_kill:"Pagma's Swordsmanship: Kill",skd_kill:"One devastating strike, 400% damage.",sk_restraint:"Pagma's Swordsmanship: Restraint",skd_restraint:"A wave that pushes back nearby monsters and holds them for a moment.",q_pg1:"The Sword Dance",pg1_o:"You... became Pagma's Successor? I heard a story long ago: in the canyon south of Winston, behind Loran Falls, there is a painting of a sword dance that pierced the sky. Go and see it.",pg1_w:"The cave behind the falls in the canyon south of Winston.",pg1_d:"You saw it? Then the sword is part of you now. Pagma would be proud.",q_pg2:"Smithing that Helps People",pg2_o:"Pagma used to say: blacksmithing is for helping people. Make 3 Rare or better items and show me you understand.",pg2_w:"Any Rare or better item, at any anvil.",pg2_d:"Your hands are Pagma's hands now. Take these points; you will need them.",zRein:"Reinhardt",zSwamp:"Haalrune Swamp (Lv 130+ · slows movement)",zRoadK:"Reinhardt Road",guildM:"Guild Association",jishuka:"Jishuka",smithRh:"Reinhardt Smith",merchantRh:"Reinhardt Merchant",innRh:"Reinhardt Innkeeper",guardRh:"Reinhardt Guard Captain",lizardN:"Swamp Lizardman",gsoldN:"Guild Soldier",banner:"Territory Banner",guild:"Guild",hBanner:"E: Banner",kGuild:"Guild",tCanyon:"Goblin Canyon Land",tWay:"Reidan Road Waystation",tMine:"Reidan Mines",pk_tCanyon:"Owner guild: rare drops in the canyon depths x1.5",pk_tWay:"Owner guild: +10% XP on the Reidan road",pk_tMine:"Owner guild: double mithril from veins",gn_tzed:"Tzedakah Guild",gn_giant:"Giant Guild",gn_snake:"Snake Guild",gNone:"nobody",bnInfo:"[{t}] This banner belongs to: {g}. {p}.",bnNoG:"Only guilds can hold land. Found or join a guild at the Guild Association in Reinhardt, then come back.",bnOurs:"[{t}] This banner is your guild's. {p}. Shield: {m} min left.",bnShield:"[{t}] {g} hold this land, and the banner is shielded for {m} more min.",bnDef:"{g} guards rush to the banner!",bnFight:"Defeat the banner guards first.",bnCap:"Raising your guild's banner... stay beside it for {n} seconds without being hit.",capBroke:"Raising the banner was interrupted!",terrClear:"The guards of {t} are down. The banner is waiting for your guild.",terrWon:"The {g} has taken {t}!",terrTaken:"{g} took {t}.",terrLost:"{g} took {t} from your guild!",raidStart:"{g} is attacking {t}! You have 4 minutes to defend the banner.",raidWon:"You defended {t}! The banner is shielded again.",gNoneHint:"You are not in a guild. Guilds are founded at the Guild Association in Reinhardt, or talk to Jishuka of Tzedakah.",gInfo:"[{g}] Lv {n} · Guild XP {x} · Members {m}/{cap} · Your contribution {c}",gMax:"max",gPerks:"Perks: +{x}% XP · +{gd}% gold from monsters · Land: {t}",gNoTerr:"none yet",oDonGold:"Donate {g} gold (+{x} guild XP)",oDonMats:"Donate materials",oDonM:"Donate all {it} ({n}) (+{x})",gDonated:"The guild gained {x} XP from your donation.",gDonNone:"You have no materials to donate.",oTerrList:"Contested lands",oLeaveG:"Leave the guild",gLeaveSure:"Leave the guild? If you are the founder, the guild is disbanded and its land is left without an owner.",gYes:"Yes",gNo:"No",oClose:"Close",gJoined:"You joined the {g}!",gLeft:"You left the {g}.",gDisband:"The {g} guild was disbanded.",gMade:"The {g} guild is founded! You are its founder.",gLvUp:"The {g} guild reached level {n}!",oMakeG:"Found a guild ({g} gold · Lv {l}+)",oMyG:"My guild",oRank:"Guild rankings",gNeedLv:"You need to reach level {n} before you can found a guild.",gNameT:"[ Found a Guild ]",gNameD:"Choose the guild's name. Founding costs {g} gold.",gNameDef:"{n}'s Guild",gMakeBtn:"Found",gNameBad:"The name needs at least 2 letters.",gNameUsed:"A guild with that name already exists.",rankH:"Guild rankings: ",terrN:"land",shL:"shielded {m} min",oJoinTz:"Join Tzedakah",gm_hi:"The Guild Association of the Eternal Kingdom. Guilds are registered here, and land is written in the name of whoever holds it.",gm_idle:"Land is not inherited. Whoever holds the banner holds the land.",js_hi:"You look like a strong adventurer. Tzedakah is recruiting. If you have no guild, come with us.",js_idle:"The Snake Guild has wanted the Reidan mines for a long time.",srh_hi:"Reinhardt's smithy street is the biggest in the kingdom. If you want my anvil, bring mithril.",srh_idle:"Every day another guild orders weapons for the land wars.",mRh_hi:"The capital's market. Everything is here, at capital prices.",innRh_hi:"The Reinhardt inn. The cleanest beds in the kingdom.",grh_idle:"Reinhardt's walls are ten metres high. Nobody has ever forced them.",q_rh0:"A Report for Reinhardt",rh0_o:"The Guild Association in the capital wants a report on the mine, because the guilds are fighting over it. Will you take it? Reinhardt is east of Reidan, past the swamp.",rh0_w:"Leave Reidan by the east gate and follow the road to the capital.",rh0_dl:"The mine report... good. The Snake Guild really is making trouble there.",rh0_d:"It arrived? Reidan owes you.",q_rh1:"Haalrune Lizards",rh1_o:"Lizardmen from the Haalrune Swamp keep attacking the caravans. Kill 8 of them. Careful: the swamp slows you down.",rh1_w:"The swamp is on the road west of the capital, north and south of it.",rh1_d:"The caravans can pass safely now. The kingdom thanks you.",q_rh2:"Mithril for the Capital",rh2_o:"Bring 6 mithril, and the Reinhardt anvil is yours to use.",rh2_w:"Mithril comes from the veins in the Reidan mines.",rh2_d:"Good mithril. The anvil is yours.",q_rh3:"The Guild Trial",rh3_o:"Want to understand the land wars? Once you are in a guild, defeat 4 guild soldiers at any territory banner.",rh3_w:"Banners stand at the Goblin Canyon cave mouth, at the Reidan road waystation and on the first mine floor.",rh3_d:"Now you know land is taken with the sword.",zReid:"Reidan",zRoadR:"Reidan Road",zMine1:"Reidan Mines · Level 1",zMine2:"The Kobold King's Den",hMine:"E: Go down the mine",foreman:"Mine Foreman",smithR:"Reidan Smith",merchantR:"Reidan Merchant",innR:"Reidan Innkeeper",mith:"Mithril",msword:"Mithril Sword",marmor:"Mithril Armor",mhelm:"Mithril Helmet",koboldN:"Mine Kobold",kkingN:"Kobold King",fo_hi:"Welcome to Reidan. The mine keeps this town alive, but kobolds have taken the lower levels.",fo_idle:"The mithril down there is worth gold, if the kobolds would leave us be.",sr_hi:"A smith? Here in Reidan we work mithril. Bring the ore and I will teach you.",sr_idle:"Mithril is lighter than iron and stronger. It needs a patient hand.",mR_hi:"Goods from Patrian at mine prices. Take a look.",innR_hi:"The Reidan inn. A warm bed after a day in the mine.",q_fo1:"Clearing the Mine",fo1_o:"Kobolds hold the first level. Kill 10 and the miners can go back. If you want to use Reidan's anvil, this is how you earn it.",fo1_w:"The mine is in the town's north-east corner.",fo1_d:"The miners are back! The smith's anvil is yours from today.",q_fo2:"First Mithril",fo2_o:"Bring me 5 mithril from the veins in the mine. Once we know it is still there, Reidan's smith will teach you to work it.",fo2_w:"The blue veins in the mine walls. Strike them with E.",fo2_d:"Clean mithril! Go to the smith; he will teach you the mithril sword, armor and helmet.",q_fo3:"The Kobold King",fo3_o:"At the bottom of the mine is the Kobold King. While he lives, they keep coming back. End him.",fo3_w:"The king is in the den below the first level.",fo3_d:"The mine is ours again. Reidan will not forget this.",q_sr1:"A Mithril Sword",sr1_o:"Show me your hands. Make a mithril sword at my anvil.",sr1_w:"3 mithril, 4 iron and a strip of leather. It wants more heat than iron.",sr1_d:"Not bad at all. You really are a smith.",q_dl4:"An Order for Reidan",dl4_o:"Reidan's smith ordered new moulds and hammers from me. Reidan is a very long way east of Patrian. Will you take them?",dl4_w:"Reidan is at the end of the eastern road past Patrian.",dl4_dl:"The moulds arrived! Now I can work more mithril.",dl4_d:"They arrived? Excellent. This is yours.",zDun1:"Goblin Canyon Depths · Floor 1",zDun2:"Goblin Canyon Depths · Floor 2",zDun3:"The Warlord's Throne",hCave:"E: Enter the cave",hDown:"E: Go down",hUp:"E: Go up",dunWarn:"This place is deadly below level {n}",bossPh1:"{b} roars and calls his warriors!",bossPh2:"{b} goes berserk! Watch for the shards",rareDrop:"Rare drop: {it} ({r})",cgobN:"Cave Goblin",gshamanN:"Goblin Shaman",gwarN:"Goblin Warlord",o_deliver:"Deliver the parcel to {it}: {c}/{n}",o_escort:"Escort the {it} to the marker: {c}/{n}",escN_merchant:"travelling merchant",escN_oldw:"old pilgrim",escGo:"The {w} is following you. Keep them safe until the marker on the map",escFail:"The traveller fell! Return to {w} to set out again",escThanks:"We made it! Thank you",gaveIt:"Handed over {it}",affUp:"Your bond with {w} is now: {r}",aff0:"Neutral",aff1:"Friendly",aff2:"Trusted",aff3:"Devoted",affGift2:"{w} gave you 2 health potions",affGift3:"{w} gave you 3 mana stones",repUp:"Your reputation in {z} is now: {r}",rep0:"Stranger",rep1:"Known",rep2:"Respected",rep3:"Honoured",rep4:"Town Hero",repH:"Reputation",repD:"Grows with quests you do for the townsfolk. Each rank lowers prices in that town by 2%",affH:"Bonds",affD:"Grows with quests, deliveries and gifts. Each level lowers their prices by 5%",affL:"♥ {n} · {r}",oGift:"Give a gift",oGiftIt:"Give {it}",giftLike:"They love this!",giftAsk:"Oh, you brought me something?",giftThanks:"Thank you, that is kind of you.",giftLove:"Just what I needed! Thank you so much.",giftWait:"You just gave me something. That is plenty for now.",giftNone:"You have nothing that would make a gift.",q_dl1:"Bread for the Patrian Inn",dl1_o:"The Patrian innkeeper ordered bread from my oven. It's a long, unsafe road. Will you take it?",dl1_w:"The inn is in Patrian, east of the wilds.",dl1_dl:"Bairan bread! I have waited a week for this. My regards to the baker.",dl1_d:"It arrived? Thank goodness. Here is your fee.",q_dl2:"Goods for the West Waystation",dl2_o:"I have a parcel for the trader at the west waystation between Winston and the plains. Nobody will cross the wilds. Will you take it?",dl2_w:"The west waystation is past the wilds.",dl2_dl:"The parcel arrived intact? Excellent. The Patrian merchant is always on time.",dl2_d:"The trader says it arrived. This is yours.",q_dl3:"A Letter for Khan",dl3_o:"Dear, could you take this letter to Khan the blacksmith? My legs are not what they were.",dl3_w:"Khan is at his smithy on East Street.",dl3_dl:"A letter from the old lady? Bless her. Tell her I'll visit.",dl3_d:"It arrived? Bless you, dear.",q_es1:"A Merchant in Danger",es1_o:"A merchant wants to reach Winston, but the road is full of monsters. Escort him to Winston's west gate.",es1_w:"The merchant is waiting. Keep him behind you and keep him safe.",es1_d:"He arrived safely. This is from him.",q_es2:"The Pilgrim's Journey",es2_o:"An old woman is travelling to her daughter in Patrian. The eastern wilds are too dangerous alone. Will you take her to Patrian's gate?",es2_w:"She is ready. Go gently.",es2_d:"She reached her daughter. May you be rewarded.",q_cf1:"A Helmet for the Guard",cf1_o:"My helmet broke in the last attack. If you can smith, make me a leather helmet and I will pay for it.",cf1_w:"Make a leather helmet at any anvil.",cf1_d:"A perfect fit! Thank you, smith.",q_cf2:"A Spear for the Hunter",cf2_o:"The wolves here strike from range, and a spear stops them before they arrive. Will you forge me an iron spear?",cf2_w:"An iron spear. There are anvils in Patrian and Winston.",cf2_d:"Heavy and balanced. Now let us see what the wolves do.",svcMore:"Anything else?",gameErr:"An error was caught and the game kept running: {e} (please screenshot it)",gAs:"Atk speed",gMs:"Move speed",gDm:"Damage",gMp:"MP",durL:"Durability",broken:"Broken! Repair it",brokeT:"{it} broke! It works at 30% until you repair it at a smith or an anvil",lowDur:"{it} is wearing out ({n}%). Get it repaired",oBuyW:"Buy weapons",oBuyA:"Buy armor and gear",oRepair:"Repair all gear ({g}G)",oRepair0:"Repair gear (all fine)",oEnh:"Enhance gear (+1 to +10)",oBack:"Back",oEnhIt:"{it} → +{b} · {m} mana stone · {p}% success ({g}G)",enhMax:"Max enhancement",arW:"Here are my weapons.",arA:"Helmets, gloves, boots and armor. Take your pick.",arEnh:"Enhancing can fail, but I have never ruined an item or lowered its level. A failure only costs the gold and the stones.",arNoRep:"Your gear is in good shape.",arNoEq:"You have nothing equipped to enhance.",repDone:"All gear repaired",enhOk:"Enhanced! {it}",enhFail:"Enhancement failed, but the item is unchanged",noMs:"You don't have enough mana stones.",empty:"Empty",clickEat:"Click: eat (+40 food, +15 HP)",clickEquip:"Click: equip",clickUnequip:"Click: unequip",matD:"Smithing material",logT:"[ System Log ]",logEmpty:"No messages yet",musicOn:"Music: On",musicOff:"Music: Off",stHeat:"Heat",stHam:"Hammer",stQuench:"Quench",hHeat:"Hold Space or the mouse to pump the bellows, let go to cool. The top bar fills while you are in the orange band, twice as fast in the gold",hzCold:"Too cold, hold to heat",hzGood:"Good, move toward the gold",hzPerf:"Perfect! Hold it there",hzHot:"Too hot, let go a bit",hHam:"Space or click: strike   ·   R: reheat   ·   Low heat shrinks the golden zone",hQuench:"Hold Space or the mouse, and release inside the golden zone",overheat:"Burnt!",creation:"[Item Creation] Name the item you created:",nameOk:"Name it",ptsHint:"+5 adds 5 points at once · Shift+click + to add all points",vsEq:'vs equipped',noneEq:'nothing equipped',perS:' hits/s',tJaffa:"Jaffa m  const m=newMon(k,(A.x1-4)*TS+8,131*TS+10);m.lv=lv;m.hp=m.max=Math.max(500,Math.round(atkV()*lvF(lv)*(16+ARN.r*8)));m.tmp=1;m.agg=1;m.eng=99;m.arena=1;mons.push(m);ARN.m=m;

 if(ARN.wait>0){ARN.wait-=dt;if(ARN.wait<=0)arenaSpawn();return;}const m=ARN.m;if(!m)return;

/* ---------------- tower of trials (SAT-TOWER-001) ---------------- */
// An endless climb on the arena floor. Floor f is level 5+4f and sends monsters picked from the world near that level;
// every tenth floor sends a boss with two guards. Past the strongest monsters in the world the same ones come back with
// more health and damage. Clearing a floor pays gold; the first clear of every fifth floor gives mana stones and of every
// tenth a gem. S.twB is your best floor, WS.tower the highest floor anyone reached. Online each climb is its own instance.
const TWP=['goblin','merman','pwolf','cgob','outlaw','gshaman','hwolf','rboar','gsold','deserter','mgolem','kobold','golem','sknight','wolf','bear','forc','cgolem','lizard','skel','wraith','cultist','demon'],

function startTower(f){if(TWR||ARN)return;if(P.ride)dismount();if(S.comp)S.comp=null;const A=DUN[8];TWR={f,ret:{x:P.x,y:P.y},wait:3,ms:null};save(true);
 fadeTo(()=>{P.x=(A.x0+4)*TS+8;P.y=131*TS+10;P.dir=2;P.hp=maxHP();P.mp=maxMP();P.cd={};camSnap=true;hudDirty=true;toast(t('twrStart',{n:f}),'good');SFX.notice();});}
function twSpawn(){const f=TWR.f,L=twL(f),A=DUN[8],boss=f%10===0,near=twNear(L,TWP).slice(0,3);
 const list=boss?[twNear(L,TWBS)[0],near[0],near[1]]:Array.from({length:Math.min(6,3+(f/10|0))},()=>near[rand()*near.length|0]);
 TWR.ms=list.map((k,i)=>{const b=MT[k],m=newMon(k,(A.x0+8+(i*5%12))*TS+8,(A.y0+5+(i*7%10))*TS+8),over=Math.max(0,L-b.lv[1]);
  m.lv=L;m.hp=m.max=Math.round(b.hp*(1+Math.max(0,L-b.lv[0])*.03)*(1+over*.04));m.dmul=1+over*.03;m.xmul=1+over*.04;m.tmp=1;m.agg=1;m.eng=99;m.tower=1;mons.push(m);
  vfx('spawn',m.x,m.y,{color:'#9a7cff'});return m;});
 announce(t(boss?'twrBoss':'twrFloor',{n:f,lv:L}));SFX.notice();}
function updateTower(dt){if(!TWR||mode==='dead')return;
 if(TWR.wait>0){TWR.wait-=dt;if(TWR.wait<=0)twSpawn();return;}if(!TWR.ms)return;
 let alive=0;for(const m of TWR.ms)if(!m.dead){m.eng=99;m.agg=1;alive++;}if(!alive)twClear();}

 if(f>(S.twB||0)){S.twB=f;if(f%5===0){addMat('mstone',boss?3:1);toast(t('twrStone',{n:boss?3:1}),'good');}if(boss){const k=GEMK[rand()*GEMK.length|0];addMat(k,1);SFX.rare();}}
 if(!WS.tower||f>WS.tower.f){WS.tower={f,n:S.look.n||t('pname'),pid:pidOf()};if(boss)announce(t('twrRec',{n:t('pname'),f}));}
 hudDirty=true;save(true);
 dialog('towerK',[t('twrNext',{n:f+1,lv:twL(f+1)})],null,[{l:t('twrUp'),f:()=>{TWR.f++;P.hp=maxHP();P.mp=maxMP();TWR.wait=2.5;}},{l:t('twrOut'),f:()=>leaveTower(.3)}]);}

 if(l1>l0){toast(t(l1===5||l1===15?'petGrow':'petUp',{n:t('pt_'+k),l:l1}),'good');SFX.level();if(PET)vfx('spawn',PET.x,PET.y,{color:'#f2c14e'});if(l1===10)setTimeout(()=>toast(t('petFight',{n:t('pt_'+k)}),'good'),600);hudDirty=true;sbSig='';}}

function rideOpt(k){return (S.mounts||{})[k]?[]:[{l:t('oBuyRide',{n:t('mt_'+k),g:MOUNTS[k].g}),pv:{ride:k},f:()=>buyRide(k)}];}

/* ---------------- weather (SAT-WEATHER-001) ---------------- */
// Shared weather on the world clock: every 20 minutes a new slot picks clear, rain, storm or fog from its index, so every
// player (and the server) sees the same sky with no message. Snow zones turn rain into snowfall; caves and houses stay
// dry. Rain makes golden fish 1.5x likelier, fog shrinks how far monsters notice you, and storms throw lightning: a ring
// marks the spot, then the bolt hits whatever stands there (monsters 300%, the player 8% of max health).
const WXS=20*60*1000,WXT=['clear','clear','rain','clear','fog','rain','storm','clear','clear','rain'];
let WXF=null,wxP=[],wxBolt=4,wxFlash=0,wxAg=1,wxLast=null;
function wxNow(){if(WXF)return WXF;const sl=Math.floor(Date.now()/WXS);return WXT[((sl*40503)>>>0)%WXT.length];}
const outdoors=()=>!!(P&&P.y<WMH*TS);
function wxHere(){const w=wxNow();if(!outdoors())return 'clear';if((w==='rain'||w==='storm')&&snowAt(P.x/TS|0,P.y/TS|0))return 'snow';return w;}
function updateWeather(dt){if(!S||!P)return;const w=wxHere();wxAg=w==='fog'?.6:1;
 if(w!==wxLast){if(wxLast!==null&&w!=='clear')toast(t('wx_'+w));wxLast=w;}
 if(wxFlash>0)wxFlash-=dt;
 if(w==='storm'&&mode==='play'&&(wxBolt-=dt)<=0){wxBolt=6+rand()*6;const a=rand()*6.28,r=rand()*120,x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r*.7;fx.push({ring:true,x,y,t:.8});
  setTimeout(()=>{if(mode!=='play'||wxHere()!=='storm')return;const pts=[];for(let i=0;i<=8;i++)pts.push([x+(i%8?(rand()-.5)*14:0),y-160+i*20]);fx.push({bolt:pts,t:.3});wxFlash=.25;noise(.3,.3,1800);shake=.25;
   for(const m of mons)if(!m.dead&&Math.hypot(m.x-x,m.y-y)<22)hitMon(m,3,{skill:1});if(Math.hypot(P.x-x,P.y-y)<20)hurtPlayer(Math.round(maxHP()*.08),S.lv,null);},800);}}
function drawWeather(){if(!S||!P||mode==='title'||mode==='lang')return;ctx.globalCompositeOperation='source-over';const w=wxHere();
 if(w==='clear'){wxP.length=0;if(wxFlash>0){ctx.fillStyle=`rgba(230,240,255,${wxFlash*1.6})`;ctx.fillRect(0,0,VW,VH);}return;}
 const n=w==='storm'?160:w==='rain'?110:w==='snow'?90:0;while(wxP.length<n)wxP.push({x:rand()*VW,y:rand()*VH,s:.6+rand()*.6});wxP.length=Math.min(wxP.length,n);
 if(w==='storm'){ctx.fillStyle='rgba(10,14,30,.28)';ctx.fillRect(0,0,VW,VH);}else if(w==='rain'){ctx.fillStyle='rgba(20,30,50,.12)';ctx.fillRect(0,0,VW,VH);}
 if(w==='rain'||w==='storm'){ctx.strokeStyle='rgba(190,215,255,.45)';ctx.lineWidth=1;ctx.beginPath();for(const d of wxP){d.y+=7*d.s;d.x-=2*d.s;if(d.y>VH){d.y=-8;d.x=rand()*(VW+40);}ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+2,d.y-7);}ctx.stroke();}
 else if(w==='snow'){ctx.fillStyle='rgba(255,255,255,.85)';for(const d of wxP){d.y+=.6*d.s;d.x+=Math.sin(gTime*1.5+d.s*9)*.3;if(d.y>VH){d.y=-4;d.x=rand()*VW;}ctx.fillRect(d.x|0,d.y|0,d.s>1?2:1,d.s>1?2:1);}}
 else if(w==='fog'){const px=P.x-camX,py=P.y-10-camY,g=ctx.createRadialGradient(px,py,40,px,py,150);g.addColorStop(0,'rgba(210,218,226,0)');g.addColorStop(1,'rgba(210,218,226,.62)');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);}
 if(wxFlash>0){ctx.fillStyle=`rgba(230,240,255,${wxFlash*1.6})`;ctx.fillRect(0,0,VW,VH);}}

/* ---------------- daily bounties (SAT-DAILY-001) ---------------- */
// Three bounties a day, the same for every player in the world: the UTC date seeds which monster each tier hunts, drawn
// only from monsters that really spawn. Progress is per player (S.dly) and is turned in at any quest board. Clearing all
// three in a day grows a streak (+10% rewards a day, up to +50%); a missed day resets it.
const DTIER=[{k:'dB',lo:1,hi:60,n:30},{k:'dS',lo:60,hi:130,n:25},{k:'dG',lo:130,hi:260,n:20}];
let dlyC=null;
function dailyList(){const d=today();if(dlyC&&dlyC.d===d)return dlyC.l;let h=7;for(const c of d)h=(h*31+c.charCodeAt(0))|0;const r=mulberry32(h>>>0),seen=[...new Set([...SPAWN,...BSPAWN,...DSPAWN].map(x=>x[0]))].sort();
 const l=DTIER.map(T=>{const pool=seen.filter(k=>MT[k]&&!MT[k].boss&&MT[k].lv[0]>=T.lo&&MT[k].lv[0]<T.hi);return pool.length?{...T,it:pool[(r()*pool.length)|0]}:null;}).filter(Boolean);dlyC={d,l};return l;}
function dlyS(){const d=today();if(!S.dly||S.dly.day!==d){const pv=S.dly,y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.dly={day:d,c:{},done:{},all:0,streak:pv&&pv.day===y&&pv.all?(pv.streak||0):0};}return S.dly;}
function dailyKill(type){if(!S)return;const D=dlyS();for(const x of dailyList())if(x.it===type&&!D.done[x.k])D.c[x.k]=Math.min(x.n,(D.c[x.k]||0)+1);}
function dailyReward(x){const b=MT[x.it],m=1+Math.min(5,dlyS().streak||0)*.1;return {xp:Math.round(b.xp*x.n*1.5*m),g:Math.round(((b.gold||1)*x.n*2+200)*m)};}
function dailyOpts(){const D=dlyS(),L=dailyList(),o=[];for(const x of L){if(D.done[x.k]||(D.c[x.k]||0)<x.n)continue;const rw=dailyReward(x);
 o.push({l:t('dTurn',{q:t(x.k),it:itN(x.it)}),f:()=>{D.done[x.k]=1;gainXP(rw.xp);S.gold+=rw.g;toast(t('dGot',{x:rw.xp,g:rw.g}),'good');SFX.quest();
  if(!D.all&&L.every(y=>D.done[y.k])){D.all=1;D.streak=(D.streak||0)+1;addMat('mstone',3);toast(t('dAll',{n:D.streak}),'good');}hudDirty=true;save(true);openDaily();}});}return o;}
function dailyLines(){const D=dlyS();return t('dHead',{s:D.streak||0})+'\n'+dailyList().map(x=>`${t(x.k)}: ${itN(x.it)} ${D.done[x.k]?'✓':`${D.c[x.k]||0}/${x.n}`}`).join('\n');}

/* ---------------- rankings (SAT-RANK-001) ---------------- */
// The Satisfy rankings board in Reinhardt. Online the server publishes WS.ranks (lv and gold lists built from every

/* ---------------- physics ---------------- */
function hitBox(x,y,r){return solidT(Math.floor((x-r)/TS),Math.floor((y-3)/TS))||solidT(Math.floor((x+r)/TS),Math.floor((y-3)/TS))||solidT(Math.floor((x-r)/TS),Math.floor((y+2)/TS))||solidT(Math.floor((x+r)/TS),Math.floor((y+2)/TS));}
function move(e,dx,dy,r){if(hitBox(e.x,e.y,r)){e.x+=dx;e.y+=dy;e.mvd=1;return;}if(dx&&!hitBox(e.x+dx,e.y,r)){e.x+=dx;e.mvd=1;}if(dy&&!hitBox(e.x,e.y+dy,r)){e.y+=dy;e.mvd=1;}}
// short grid path (BFS up to R tiles out) to the target tile, or to the reachable tile nearest it
function gridPath(sx,sy,tx,ty,R){const W2=R*2+1,ox=sx-R,oy=sy-R,prev=new Int32Array(W2*W2).fill(-1),q=[sx-ox+(sy-oy)*W2];prev[q[0]]=q[0];let h=0,best=q[0],bd=1e9;
 while(h<q.length){const c=q[h++],cx=c%W2+ox,cy=(c/W2|0)+oy,dd=Math.abs(cx-tx)+Math.abs(cy-ty);if(dd<bd){bd=dd;best=c;if(!dd)break;}
  for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+a,ny=cy+b;if(nx<ox||ny<oy||nx>=ox+W2||ny>=oy+W2||ny>=WMH)continue;const n=nx-ox+(ny-oy)*W2;if(prev[n]>=0||solidT(nx,ny))continue;prev[n]=c;q.push(n);}}
 const path=[];for(let c=best;c!==prev[c];c=prev[c])path.push([c%W2+ox,(c/W2|0)+oy]);return path.reverse();}
const lineClear=(m,x,y,r)=>{const d=Math.hypot(x-m.x,y-m.y),n=Math.ceil(d/8);for(let i=1;i<n;i++){const k=i/n;if(hitBox(m.x+(x-m.x)*k,m.y+(y-m.y)*k,r))return false;}return true;};
// chase: straight at the target while the way is open; when blocked, walk a grid path around trees, walls and water
function chase(m,dx,dy,d,sp,mr,dt){const ux=dx/d,uy=dy/d;m.pT=(m.pT||0)-dt;
 if(m.path&&m.path.length){
  if(m.pT<=0){m.pT=.5;if(lineClear(m,m.x+dx,m.y+dy,mr)){m.path=null;return chase(m,dx,dy,d,sp,mr,0);}}
  const [px,py]=m.path[0],wx=px*TS+8,wy=py*TS+10,ddx=wx-m.x,ddy=wy-m.y,dd=Math.hypot(ddx,ddy);
  if(dd<3){m.path.shift();return;}
  const ox=m.x,oy=m.y;move(m,ddx/dd*sp*dt,ddy/dd*sp*dt,mr);
  if(Math.hypot(m.x-ox,m.y-oy)<sp*dt*.2){m.pst=(m.pst||0)+dt;if(m.pst>.5){m.pst=0;m.path=null;m.stuckN=(m.stuckN||0)+1;}}else{m.pst=0;m.stuckN=0;}
  return;}
 const ox=m.x,oy=m.y;move(m,ux*sp*dt,uy*sp*dt,mr);
 if(Math.hypot(m.x-ox,m.y-oy)<sp*dt*.35)m.stk=(m.stk||0)+dt;else{m.stk=0;m.stuckN=0;}
 if(m.stk>.35&&m.pT<=0){m.stk=0;m.pT=.8;const p=gridPath(Math.floor(m.x/TS),Math.floor(m.y/TS),Math.floor((m.x+dx)/TS),Math.floor((m.y+dy)/TS),18);
  if(p.length)m.path=p;else m.stuckN=(m.stuckN||0)+1;}
 // walled in with no way round: give up the chase and go home (the leash walks or, if needed, warps them back)
 if((m.stuckN||0)>=4){m.stuckN=0;m.path=null;m.ret=1;m.eng=0;}}
const inDen=()=>P.y<WH*TS&&P.x>50*TS-4&&P.x<BW*TS;

function bqMake(gather){const wild=new Set([...SPAWN,...BSPAWN,...DSPAWN].map(x=>x[0])),pool=Object.keys(MT).filter(k=>{const b=MT[k];return wild.has(k)&&!b.boss&&b.aggro!==undefined&&b.lv[0]<=S.lv+6&&b.lv[1]>=S.lv-20&&(b.board!==0);});

 const m=['wood','ore','leather'][(rand()*3)|0],n=4+((rand()*6)|0);return {id:'bq'+(++S.uid),obj:{t:'have',it:m,n,take:1},xp:14*n,gold:7*n};}

// Guild membership, contribution and perks. A guild's level comes from what its members give it (quests, donations,

const pidOf=()=>S.pid||(S.pid='p'+Date.now().toString(36)+(rand()*1e6|0).toString(36));

const gCol=id=>(WS&&WS.guilds[id]||{}).col||'#9a9aa6';
const gLv=g=>g.npc?g.lv:Math.max(1,GXP.filter(x=>g.xp>=x).length);
const myG=()=>S&&S.guild&&WS&&WS.guilds[S.guild]||null;
const ownsT=k=>!!(S&&S.guild&&WS&&WS.terr[k]&&WS.terr[k].own===S.guild);
const castleB=g=>WS&&WS.castle&&WS.castle.own===g.id?.05:0;
const gXPB=()=>{const g=myG();if(!g)return 0;const l=gLv(g);return (l>=8?.1:l>=5?.06:l>=2?.03:0)+castleB(g);};
const gGoldB=()=>{const g=myG();if(!g)return 0;const l=gLv(g);return (l>=7?.1:l>=3?.05:0)+castleB(g);};
