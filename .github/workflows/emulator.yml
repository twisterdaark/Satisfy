# SAT-ONLINE-116 (plan U021): the database rules on the real Realtime Database emulator, with three accounts, and the game's
# own online code between two clients on the real SDK and the Auth emulator, on every pull request that changes the rules,
# the online code or these tests (tests/emulator/). The emulator and its test library are
# installed here only (--no-save), so the game's package.json stays as it is. A failed check shows its failed tests as
# annotations on the pull request. On claude-a/rules-next it also proves the rules the owner deploys load in the real engine.
name: rules on the emulator
on:
  pull_request:
    paths: ['backend/**', 'src/net/**', 'tests/emulator/**', '.github/workflows/emulator.yml', 'firebase.json']
  push:
    branches: [main, claude-a/rules-next]
    paths: ['backend/**', 'src/net/**', 'tests/emulator/**', '.github/workflows/emulator.yml', 'firebase.json']
permissions:
  contents: read
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund --no-save --legacy-peer-deps firebase-tools@14 @firebase/rules-unit-testing@4 firebase@12.19.0
      - name: rules with three accounts; two clients
        run: |
          set -o pipefail
          npx firebase emulators:exec --only database,auth --project demo-satisfy "node --test --test-concurrency=1 --test-force-exit --test-timeout=120000 tests/emulator/*.emu.cjs" 2>&1 | tee test.log || {
            grep -E -A3 "^not ok|^\s+error:" test.log | grep -vE "^\s+(---|duration_ms|type|location|failureType):" | head -40 | sed 's/^/::error::/'
            exit 1
          }
