# SAT-ONLINE-116 (plan U021): the database rules on the real Realtime Database emulator, with three accounts, on every pull
# request that changes the rules or these tests (tests/emulator/rules.emu.cjs). The emulator and its test library are
# installed here only (--no-save), so the game's package.json stays as it is. A failed check shows its failed tests as
# annotations on the pull request.
name: rules on the emulator
on:
  pull_request:
    paths: ['backend/**', 'tests/emulator/**', '.github/workflows/emulator.yml', 'firebase.json']
  push:
    branches: [main]
    paths: ['backend/**', 'tests/emulator/**', '.github/workflows/emulator.yml', 'firebase.json']
permissions:
  contents: read
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund --no-save --legacy-peer-deps firebase-tools@14 @firebase/rules-unit-testing@4 firebase@11
      - name: rules with three accounts
        run: |
          set -o pipefail
          npx firebase emulators:exec --only database --project demo-satisfy "node --test tests/emulator/rules.emu.cjs" 2>&1 | tee test.log || {
            grep -E "^not ok|^\s+error:|^\s+(Error|FirebaseError)|PERMISSION_DENIED|Expected request to (fail|succeed)" test.log | head -30 | sed 's/^/::error::/'
            exit 1
          }
