# SAT-ONLINE-107 (plan U326): the tests on every pull request and every push to main, so a PR shows green or red before
# review instead of only the list of tests its author ran by hand. The unit and content tests run in full (about a
# minute); the regression job runs a smoke set of the browser tests (boot, saves, the online stack over the fake,
# rendering against the baseline, and the newest features), the whole set takes too long for every push; the browsers job
# runs the first steps (boot, a new game, saves) in Firefox and WebKit too (plan U370), as phones and Safari use them.
# A failing step lists its failed tests as annotations (.github/scripts/annotate.cjs), shown on the pull request.
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
# ubuntu-24.04, not -latest: -latest became Ubuntu 26 on 2026-10-19, which Playwright 1.56 can't install Chromium's libraries on
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the golden tests export the baseline commit with git archive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee test.log || { node .github/scripts/annotate.cjs test.log; exit 1; }
      - run: |
          set -o pipefail
          npm run test:content 2>&1 | tee test.log || { node .github/scripts/annotate.cjs test.log; exit 1; }
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: regression smoke set
        run: |
          set -o pipefail
          node --test --test-concurrency=2 tests/regression/{boot,save,golden,ids,online-local,online-firebase,party,guild,drops,fixedtick}.test.cjs 2>&1 | tee test.log || { node .github/scripts/annotate.cjs test.log; exit 1; }
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: boot and saves in ${{ matrix.browser }}
        env:
          SATISFY_BROWSER: ${{ matrix.browser }}
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/regression/boot.test.cjs tests/regression/save.test.cjs 2>&1 | tee test.log || { node .github/scripts/annotate.cjs test.log; exit 1; }
